<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>

<style>
  .water-step { width: 36px; height: 36px; border-radius: 11px; font-size: 16px; font-weight: 700; cursor: pointer; }
  @media (min-width: 600px) and (max-width: 1023px) { .water-step { width: 44px; height: 44px; } }
  .gram-btn { width: 36px; height: 36px; border-radius: 11px; font-size: 16px; font-weight: 700; cursor: pointer; }
  @media (max-width: 599px) { .gram-btn { width: 32px; height: 32px; } }
  @media (min-width: 600px) and (max-width: 1023px) { .gram-btn { width: 44px; height: 44px; } }

  /* Photo(s) on top: each ingredient's zone is outlined and numbered, and the same
     number sits on the ingredient's zoomed thumbnail below. */
  .photo-strip { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .photo-strip::-webkit-scrollbar { display: none; }
  .photo-card { flex: 0 0 auto; max-width: 100%; scroll-snap-align: center; position: relative; border-radius: 22px; overflow: hidden; border: 1px solid var(--card-border); background: #0d0b12; display: flex; align-items: center; justify-content: center; }
  .photo-strip.many .photo-card { max-width: 88%; }
  .photo-frame { position: relative; display: block; line-height: 0; }
  .photo-frame img { display: block; max-width: 100%; max-height: 230px; width: auto; height: auto; }
  @media (min-width: 600px) { .photo-frame img { max-height: 320px; } }
  @media (min-width: 1024px) { .photo-frame img { max-height: 460px; } }
  .photo-tag { position: absolute; left: 10px; top: 10px; background: rgba(10,10,15,0.75); border: 1px solid rgba(255,255,255,0.16); color: #F5F5F7; border-radius: 100px; padding: 4px 10px; font-size: 11px; font-weight: 700; line-height: 1.3; }
  .pbox { position: absolute; border: 2px solid var(--c); border-radius: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,0.35); cursor: pointer; transition: opacity 0.2s, box-shadow 0.2s; }
  .pbox .pnum { position: absolute; left: -2px; top: -2px; transform: translate(0, -100%); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 7px 7px 7px 0; background: var(--c); color: #0A0A0F; font: 700 11px 'Space Mono', monospace; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .photo-frame.focus .pbox:not(.on) { opacity: 0.25; }
  .pbox.on { box-shadow: 0 0 0 3px var(--c), 0 0 24px var(--c); }
  .thumb-wrap { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
  .thumb-wrap .thumb-photo, .thumb-wrap .thumb-empty { width: 100%; height: 100%; border-radius: 14px; }
  .thumb-empty { background: linear-gradient(140deg, #7C5CFF, #2DD4FF); opacity: 0.35; }
  .thumb-wrap .tnum { position: absolute; left: -4px; top: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 6px; background: var(--c); color: #0A0A0F; font: 700 10.5px 'Space Mono', monospace; display: flex; align-items: center; justify-content: center; border: 2px solid var(--card); }
  .item-card.flash { box-shadow: 0 0 0 2px var(--c); }
  .add-photo { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 18px; border: 1px solid var(--card-border); background: var(--card); color: var(--ink); font-size: 12.5px; font-weight: 700; cursor: pointer; }
</style>
<script>
  (function () {
    var t = localStorage.getItem('cadence_theme') || 'dark';
    if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script src="static/js/splash.js"></script>

<body class="with-shell" data-page="escanear">
<div class="app">
  <div class="page-head" style="padding:22px 20px 12px;display:flex;align-items:center;gap:12px;">
    <a href="scan.html" data-replace aria-label="Volver" class="icon-btn" style="width:44px;height:44px;border-radius:13px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
    <div style="flex:1;">
      <h1 class="disp" style="margin:0;font-size:20px;font-weight:700;">Confirma tu plato</h1>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;" id="subtitle">cargando…</div>
    </div>
  </div>

  <div class="app-content" style="padding-bottom:150px;">
    <div class="confirm-grid">
      <div class="col" id="photoCol"></div>
      <div class="col" id="itemsCol">
        <div class="meal-pick" id="mealPick" role="group" aria-label="Comida"></div>
        <div id="mealHint" style="font-size:11.5px;color:var(--ink-soft);line-height:1.4;padding:0 4px;margin-top:-4px;"></div>
        <div class="confirm-items" id="itemsWrap"></div>
      </div>
    </div>
  </div>

  <div class="confirm-bar" id="confirmBar">
    <div class="total-row" style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
      <span style="font-size:12px;color:var(--ink-soft);font-weight:600;">TOTAL DEL PLATO</span>
      <span class="disp" id="totalKcal" style="font-size:19px;font-weight:700;">0 kcal</span>
    </div>
    <div class="save-error" id="saveError" role="alert"></div>
    <button class="btn-primary" id="confirmBtn">
      Confirmar y registrar
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<script src="static/js/icons.js"></script>
<script src="static/js/api.js"></script>
<script src="static/js/units.js"></script>
<script src="static/js/sfx.js"></script>
<script src="static/js/theme.js"></script>
<script src="static/js/shell.js"></script>
<script>
const MEALS = [
  { key: 'desayuno', label: 'Desayuno' },
  { key: 'almuerzo', label: 'Almuerzo' },
  { key: 'merienda', label: 'Merienda' },
  { key: 'cena', label: 'Cena' },
];
// One colour per ingredient: its zone on the photo, its number and its thumbnail share it.
const ZONE_COLORS = ['#7C5CFF', '#2DD4FF', '#FF8A5B', '#3DDC84', '#FFC83D', '#FF5C9E'];
const zoneColor = (idx) => ZONE_COLORS[idx % ZONE_COLORS.length];

const raw = sessionStorage.getItem('cadence_analyze_result');
if (!raw) {
  window.location.replace('scan.html');
}
const analyzeResult = JSON.parse(raw || '{"components":[]}');
const photos = readPhotos();
let meal = sessionStorage.getItem('cadence_meal') || null;
const takenAt = sessionStorage.getItem('cadence_taken_at') || null; // when the photo was taken
let waterMl = Number(sessionStorage.getItem('cadence_water_ml') || 0); // plain water seen in the photo: goes to the water bar
let mealSource = meal ? 'chosen' : 'none'; // 'chosen' = the user picked it, 'photo' = suggested from the photo time

// Per-component live state: selected candidate id, its kcal/100g, grams, and
// where it sits on which photo (null for foods added by hand).
const state = analyzeResult.components.map((component) => {
  // selectedId/grams are present when we come back from search.html after the
  // user already tweaked this plate (see persistState()).
  const selected = component.candidates.find((c) => c.id === component.selectedId) || component.candidates[0];
  return {
    detected_name: component.detected_name,
    confidence: component.confidence ?? null,
    candidates: component.candidates,
    selectedId: selected ? selected.id : null,
    energyPer100g: selected ? (selected.energy_kcal_100g || 0) : 0,
    // A soup or a drink is measured in ml (or oz), a solid in grams: the model's word, else the food's own flag.
    liquid: component.liquid !== undefined && component.liquid !== null ? !!component.liquid : !!(selected && selected.liquid),
    // The model's portion guess (if any) is only a starting point; the stepper is the truth.
    grams: component.grams || component.estimated_grams || 100,
    photo: component.photo ?? null,
    box: component.box ?? null,
    crop: null,
  };
});

function setWater(ml) {
  waterMl = Math.max(0, ml);
  if (waterMl) sessionStorage.setItem('cadence_water_ml', String(waterMl)); else sessionStorage.removeItem('cadence_water_ml');
  renderItems();
}

function persistState() {
  const merged = state.map((item) => ({
    detected_name: item.detected_name,
    confidence: item.confidence,
    candidates: item.candidates,
    selectedId: item.selectedId,
    grams: item.grams,
    liquid: item.liquid,
    photo: item.photo,
    box: item.box,
  }));
  sessionStorage.setItem('cadence_analyze_result', JSON.stringify({ components: merged }));
  if (meal) sessionStorage.setItem('cadence_meal', meal);
}

function renderSubtitle() {
  const ai = state.filter((item) => item.confidence != null).length;
  const manual = state.length - ai;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  let text;
  if (state.length === 0) text = waterMl ? 'Agua detectada' : 'Sin componentes';
  else if (ai === 0) text = plural(manual, 'alimento agregado', 'alimentos agregados');
  else text = `${plural(ai, 'identificado', 'identificados')} por IA${manual ? ` · ${plural(manual, 'manual', 'manuales')}` : ''}`;
  if (photos.length > 1) text += ` · ${photos.length} fotos`;
  document.getElementById('subtitle').textContent = text;
}

function itemKcal(item) {
  return (item.energyPer100g * item.grams) / 100;
}

function renderTotal() {
  const total = state.reduce((sum, item) => sum + itemKcal(item), 0);
  document.getElementById('totalKcal').textContent = `${Math.round(total)} kcal`;
}

// ---- Photos on top, with each ingredient's zone outlined and numbered ----
function renderPhotos() {
  const col = document.getElementById('photoCol');
  col.innerHTML = '';
  if (photos.length === 0) return;

  const strip = document.createElement('div');
  strip.className = `photo-strip${photos.length > 1 ? ' many' : ''}`;
  photos.forEach((src, photoIdx) => {
    const boxes = state
      .map((item, idx) => ({ item, idx }))
      .filter(({ item }) => item.photo === photoIdx && item.box)
      .map(({ item, idx }) => {
        const [x, y, w, h] = item.box;
        return `<div class="pbox" data-item="${idx}" style="--c:${zoneColor(idx)};left:${x * 100}%;top:${y * 100}%;width:${w * 100}%;height:${h * 100}%;" title="${escapeHtml(item.detected_name)}"><span class="pnum">${idx + 1}</span></div>`;
      })
      .join('');
    const count = state.filter((item) => item.photo === photoIdx).length;
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.innerHTML = `
      <div class="photo-frame" data-photo="${photoIdx}">
        <img src="${src}" alt="Foto ${photoIdx + 1} de tu plato">
        ${boxes}
        ${photos.length > 1 ? `<span class="photo-tag">Foto ${photoIdx + 1} · ${count} alimento${count === 1 ? '' : 's'}</span>` : ''}
      </div>`;
    strip.appendChild(card);
  });
  col.appendChild(strip);

  col.querySelectorAll('.pbox').forEach((box) => {
    box.addEventListener('click', () => focusItem(Number(box.dataset.item), { scroll: true }));
  });
}

// Highlight an ingredient both on the photo (its zone) and in the list (its card).
let focusTimer = null;
function focusItem(idx, { scroll = false } = {}) {
  document.querySelectorAll('.pbox').forEach((box) => box.classList.toggle('on', Number(box.dataset.item) === idx));
  document.querySelectorAll('.photo-frame').forEach((frame) => frame.classList.add('focus'));
  document.querySelectorAll('.item-card').forEach((card) => card.classList.toggle('flash', Number(card.dataset.idx) === idx));
  if (scroll) {
    const card = document.querySelector(`.item-card[data-idx="${idx}"]`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  clearTimeout(focusTimer);
  focusTimer = setTimeout(() => {
    document.querySelectorAll('.pbox.on').forEach((box) => box.classList.remove('on'));
    document.querySelectorAll('.photo-frame.focus').forEach((frame) => frame.classList.remove('focus'));
    document.querySelectorAll('.item-card.flash').forEach((card) => card.classList.remove('flash'));
  }, 1800);
}

// Zoomed, centred crop of the ingredient's zone (computed once, then cached on the item).
async function hydrateThumbs() {
  await Promise.all(state.map(async (item, idx) => {
    if (item.photo == null || !photos[item.photo]) return;
    if (!item.crop) item.crop = await cropThumb(photos[item.photo], item.box || [0, 0, 1, 1]);
    const el = document.querySelector(`.thumb-wrap[data-idx="${idx}"] .thumb-photo`);
    if (el && item.crop) el.style.backgroundImage = `url('${item.crop}')`;
  }));
}

function thumbHtml(item, idx) {
  const color = zoneColor(idx);
  const body = item.photo != null && photos[item.photo]
    ? `<div class="thumb-photo"${item.crop ? ` style="background-image:url('${item.crop}')"` : ''}></div>`
    : '<div class="thumb-empty"></div>';
  const num = item.photo != null ? `<span class="tnum">${idx + 1}</span>` : '';
  return `<div class="thumb-wrap" data-idx="${idx}" style="--c:${color};">${body}${num}</div>`;
}

// ---- Meal picker: the slot the entries are stamped into (see /api/confirm) ----
// "ayer, 1:05 p. m." - how the photo's moment reads to the user.
function whenLabel() {
  if (!takenAt) return '';
  const when = new Date(takenAt);
  if (Number.isNaN(when.getTime())) return '';
  const startOf = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const days = Math.round((startOf(new Date()) - startOf(when)) / 86400000);
  const date = when.toLocaleDateString('es', { day: 'numeric', month: 'short' }).replace('.', '');
  const day = days <= 0 ? 'hoy' : days === 1 ? 'ayer' : date;
  const of = days <= 0 ? 'de hoy' : days === 1 ? 'de ayer' : `del ${date}`; // "de hoy", "de ayer", "del 20 oct"
  const time = when.toLocaleTimeString('es', { hour: 'numeric', minute: '2-digit', hour12: true });
  return { day, of, time };
}

// The meal is only a suggestion until the user touches it: it never locks.
function renderMealHint() {
  const hint = document.getElementById('mealHint');
  const w = whenLabel();
  const label = MEALS.find((m) => m.key === meal);
  if (mealSource === 'photo' && w && label) {
    hint.textContent = `Sugerido por la hora de tu foto (${w.day}, ${w.time}). Puedes cambiarlo.`;
  } else if (mealSource === 'chosen' && label) {
    hint.textContent = `Se registrará como ${label.label.toLowerCase()} ${w ? w.of : 'de hoy'}.`;
  } else if (w) {
    hint.textContent = `Elige a qué comida corresponde (foto de ${w.day}, ${w.time}).`;
  } else {
    hint.textContent = label ? '' : 'Elige a qué comida corresponde.';
  }
}

function renderMealPick() {
  const wrap = document.getElementById('mealPick');
  wrap.innerHTML = MEALS.map((m) => `<button type="button" data-meal="${m.key}" aria-pressed="${meal === m.key}">${m.label}</button>`).join('');
  wrap.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (window.sfx) sfx.play('pick');
      meal = btn.dataset.meal;
      mealSource = 'chosen';
      sessionStorage.setItem('cadence_meal', meal);
      renderMealPick();
    });
  });
  renderMealHint();
}

async function selectCandidate(idx, candidateId) {
  if (window.sfx) sfx.play('pick');
  const item = state[idx];
  item.selectedId = candidateId;
  const candidate = item.candidates.find((c) => c.id === candidateId);
  if (candidate.liquid !== undefined && candidate.liquid !== null) item.liquid = !!candidate.liquid;
  if (candidate.energy_kcal_100g != null) {
    item.energyPer100g = candidate.energy_kcal_100g;
  } else {
    try {
      const detail = await apiGet(`api/ingredient/${candidateId}`);
      candidate.energy_kcal_100g = detail.energy_kcal_100g;
      item.energyPer100g = detail.energy_kcal_100g;
    } catch (err) {
      showToast(`No se pudo cargar info del alimento: ${err.message}`);
    }
  }
  renderItems();
}

// Type the food yourself when the 5 suggestions are not it: results come from the same
// catalog and replace/extend this ingredient's options without touching the others.
async function runFind(idx, term) {
  const item = state[idx];
  const text = (term || '').trim();
  if (text.length < 2) { item.searchResults = []; paintFind(idx); return; }
  const box = document.getElementById(`find-${idx}`);
  if (box) box.innerHTML = '<div class="find-note">Buscando…</div>';
  try {
    const found = await apiGet(`api/search?term=${encodeURIComponent(text)}`);
    if (item.searchTerm != null && item.searchTerm.trim() !== text) return; // the user typed on since
    item.searchResults = found;
  } catch (err) {
    item.searchResults = null;
    if (box) box.innerHTML = `<div class="find-note">No se pudo buscar: ${escapeHtml(err.message || 'error')}</div>`;
    return;
  }
  paintFind(idx);
}

function paintFind(idx) {
  const box = document.getElementById(`find-${idx}`);
  const found = state[idx].searchResults;
  if (!box || !found) return;
  if (found.length === 0) { box.innerHTML = '<div class="find-note">No encontré nada con ese nombre. Prueba con otra palabra (ej. «caldo», «pollo»).</div>'; return; }
  box.innerHTML = found.map((f) => `
    <button type="button" class="find-row" data-id="${f.id}">
      <span>${escapeHtml(f.name)}</span><small>${Math.round(f.energy_kcal_100g)} kcal / 100 ${f.liquid ? 'ml' : 'g'}</small>
    </button>`).join('');
  box.querySelectorAll('.find-row').forEach((btn, i) => btn.addEventListener('click', () => {
    const picked = found[i];
    const item = state[idx];
    if (!item.candidates.some((c) => c.id === picked.id)) {
      item.candidates.push({ id: picked.id, name: picked.name, score: null, energy_kcal_100g: picked.energy_kcal_100g, liquid: picked.liquid });
    }
    item.searching = false;
    if (window.sfx) sfx.play('add');
    selectCandidate(idx, picked.id);
  }));
}

function stepFor(grams) {
  return grams >= 100 ? 10 : 5;
}

function emptyState() {
  const mealQuery = meal ? `&meal=${meal}` : '';
  return `
    <div class="empty-state span-all">
      <span style="font-size:36px;color:var(--accent-to);"><i data-ico="smiley-meh"></i></span>
      <h3 class="disp" style="margin:14px 0 6px;font-size:15.5px;font-weight:700;">No logramos identificar el plato</h3>
      <p style="margin:0 0 18px;font-size:12px;color:var(--ink-soft);line-height:1.5;">Puede ser el ángulo, la luz, o un alimento poco común. Prueba de nuevo o regístralo a mano — toma 10 segundos.</p>
      <div style="display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto;">
        <a href="scan.html${meal ? `?meal=${meal}` : ''}" data-replace class="btn-primary"><i data-ico="camera"></i>&nbsp;Tomar otra foto</a>
        <a href="search.html?from=confirm${mealQuery}" data-replace class="btn-secondary" style="display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;"><i data-ico="magnifying-glass"></i> Buscar manualmente</a>
        <a href="scan.html?mode=barcode${meal ? `&meal=${meal}` : ''}" data-replace class="btn-secondary" style="display:flex;align-items:center;justify-content:center;min-height:44px;">▦ Escanear código de barras</a>
      </div>
    </div>`;
}

function renderItems() {
  const wrap = document.getElementById('itemsWrap');
  wrap.innerHTML = '';
  renderSubtitle();

  const bar = document.getElementById('confirmBar');
  document.getElementById('mealPick').style.display = state.length === 0 ? 'none' : 'flex';
  bar.style.display = state.length === 0 && !waterMl ? 'none' : '';
  document.getElementById('confirmBtn').firstChild.textContent = state.length === 0 ? 'Sumar el agua ' : 'Confirmar y registrar ';

  if (state.length === 0 && !waterMl) {
    wrap.innerHTML = emptyState();
    return;
  }

  if (waterMl > 0) {
    const water = document.createElement('div');
    water.className = 'card water-card span-all';
    water.innerHTML = `
      <span class="wc-ico"><i data-ico="drop"></i></span>
      <div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:700;">Agua detectada</div><div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">Se suma a tu barra de agua de hoy, sin calorías.</div></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="water-step" id="waterMinus" aria-label="Menos agua" style="border:1px solid var(--card-border);background:var(--bg);color:var(--ink);">−</button>
        <span class="mono" style="font-size:13px;font-weight:700;min-width:62px;text-align:center;">${cadenceUnits.fmtWater(waterMl)}</span>
        <button class="water-step" id="waterPlus" aria-label="Más agua" style="border:none;background:linear-gradient(135deg,var(--accent-from),var(--accent-to));color:#fff;">+</button>
      </div>
      <button class="wc-x" id="waterDrop" aria-label="No sumar el agua"><i data-ico="x"></i></button>`;
    wrap.appendChild(water);
    water.querySelector('#waterMinus').addEventListener('click', () => setWater(waterMl - Math.round(cadenceUnits.liquidStep(50))));
    water.querySelector('#waterPlus').addEventListener('click', () => setWater(waterMl + Math.round(cadenceUnits.liquidStep(50))));
    water.querySelector('#waterDrop').addEventListener('click', () => setWater(0));
  }

  state.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card item-card';
    card.dataset.idx = idx;
    card.style.cssText = `display:flex;flex-direction:column;gap:0;--c:${zoneColor(idx)};`;

    const pills = item.candidates.map((c) => {
      const active = c.id === item.selectedId;
      return `<button data-idx="${idx}" data-cid="${c.id}" class="candidate-pill chip-soft${active ? ' active' : ''}">${active ? '<i data-ico="check"></i> ' : ''}${escapeHtml(c.name)}${c.score != null ? ` ${Math.round(c.score * 100)}%` : ''}</button>`;
    }).join('');

    card.innerHTML = `
      <div style="display:flex;gap:11px;">
        ${thumbHtml(item, idx)}
        <div style="flex:1;min-width:0;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <span style="font-size:14px;font-weight:700;">${escapeHtml(item.detected_name)}</span>
            <span class="disp" id="kcal-${idx}" style="font-size:13px;font-weight:700;color:var(--accent-to);white-space:nowrap;">${Math.round(itemKcal(item))} kcal</span>
          </div>
          <div style="display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;">${pills || '<span style="font-size:11px;color:var(--ink-soft);">Sin coincidencias — búscalo aquí abajo.</span>'}
            <button type="button" class="candidate-pill chip-soft find-btn" data-idx="${idx}" aria-expanded="${item.searching ? 'true' : 'false'}"><i data-ico="magnifying-glass"></i> Buscar otro</button>
          </div>
        </div>
      </div>
      ${item.searching ? `
      <div class="find-box" data-idx="${idx}">
        <input type="search" class="find-input" data-idx="${idx}" placeholder="Escríbelo como quieras: sopa de pollo…" value="${escapeHtml(item.searchTerm ?? item.detected_name)}" autocomplete="off" enterkeyhint="search">
        <div class="find-results" id="find-${idx}"></div>
      </div>` : ''}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:11px;border-top:1px solid var(--card-border);">
        <span style="font-size:11.5px;color:var(--ink-soft);font-weight:600;">Cantidad</span>
        <div style="display:flex;align-items:center;gap:10px;">
          <button data-idx="${idx}" data-delta="-1" class="gram-btn" aria-label="Menos" style="border:1px solid var(--card-border);background:var(--bg);color:var(--ink);">−</button>
          <span class="mono" id="grams-${idx}" style="font-size:13px;font-weight:700;min-width:54px;text-align:center;">${cadenceUnits.fmtAmount(item.grams, item.liquid)}</span>
          <button data-idx="${idx}" data-delta="1" class="gram-btn" aria-label="Más" style="border:none;background:linear-gradient(135deg,var(--accent-from),var(--accent-to));color:#fff;">+</button>
        </div>
      </div>
    `;
    wrap.appendChild(card);
  });

  const addMore = document.createElement('a');
  addMore.href = `search.html?from=confirm${meal ? `&meal=${meal}` : ''}`;
  addMore.setAttribute('data-replace', '');
  addMore.className = 'dashed-add span-all';
  addMore.style.cssText = 'border-radius:18px;padding:13px;justify-content:center;gap:8px;font-size:12.5px;font-weight:600;min-height:44px;';
  addMore.innerHTML = '<span style="font-weight:800;color:var(--accent-to);">+</span> Agregar componente que falte';
  addMore.addEventListener('click', persistState);
  wrap.appendChild(addMore);

  const morePhoto = document.createElement('a');
  morePhoto.href = `scan.html?append=1${meal ? `&meal=${meal}` : ''}`;
  morePhoto.setAttribute('data-replace', '');
  morePhoto.className = 'add-photo span-all';
  morePhoto.innerHTML = '<i data-ico="camera"></i> Agregar otra foto a este registro';
  morePhoto.addEventListener('click', persistState);
  wrap.appendChild(morePhoto);

  const note = document.createElement('div');
  note.className = 'span-all';
  note.style.cssText = 'display:flex;gap:7px;align-items:flex-start;padding:2px 4px;';
  note.innerHTML = '<span style="font-size:12px;">ℹ️</span><span style="font-size:11px;color:var(--ink-soft);line-height:1.4;">La IA identifica los alimentos — las calorías siempre salen de la base de datos de alimentos, no de la IA.</span>';
  wrap.appendChild(note);

  wrap.querySelectorAll('.thumb-wrap').forEach((thumb) => {
    thumb.style.cursor = 'pointer';
    thumb.addEventListener('click', () => focusItem(Number(thumb.dataset.idx)));
  });
  wrap.querySelectorAll('.candidate-pill:not(.find-btn)').forEach((btn) => {
    btn.addEventListener('click', () => selectCandidate(Number(btn.dataset.idx), Number(btn.dataset.cid)));
  });
  wrap.querySelectorAll('.find-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (window.sfx) sfx.play('tick');
      const item = state[Number(btn.dataset.idx)];
      item.searching = !item.searching;
      renderItems();
      if (item.searching) {
        const input = document.querySelector(`.find-input[data-idx="${btn.dataset.idx}"]`);
        if (input) { input.focus(); input.select(); runFind(Number(btn.dataset.idx), input.value); }
      }
    });
  });
  wrap.querySelectorAll('.find-input').forEach((input) => {
    const idx = Number(input.dataset.idx);
    if (state[idx].searchResults) paintFind(idx);
    let timer = null;
    input.addEventListener('input', () => {
      state[idx].searchTerm = input.value;
      clearTimeout(timer);
      timer = setTimeout(() => runFind(idx, input.value), 350);
    });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(timer); runFind(idx, input.value); } });
  });
  wrap.querySelectorAll('.gram-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      const direction = Number(btn.dataset.delta);
      const current = state[idx].grams;
      // Finer steps for small portions (a 60 g popsicle), coarser for a plate of rice.
      const step = stepFor(direction < 0 ? current - 1 : current);
      const next = current + direction * (state[idx].liquid ? cadenceUnits.liquidStep(step) : step); // a whole ounce for a liquid in oz
      state[idx].grams = Math.min(1500, Math.max(5, state[idx].liquid && cadenceUnits.isOz() ? Math.round(next * 100) / 100 : Math.round(next)));
      if (window.sfx) sfx.play('tick');
      document.getElementById(`grams-${idx}`).textContent = cadenceUnits.fmtAmount(state[idx].grams, state[idx].liquid);
      document.getElementById(`kcal-${idx}`).textContent = `${Math.round(itemKcal(state[idx]))} kcal`;
      renderTotal();
    });
  });

  renderTotal();
  hydrateThumbs();
}

// On desktop the total + confirm button live in the right column (mockup);
// below that they stay as a fixed bar at the bottom.
const desktopMq = window.matchMedia('(min-width: 1024px)');
function placeBar() {
  const bar = document.getElementById('confirmBar');
  if (desktopMq.matches) {
    document.getElementById('itemsCol').appendChild(bar);
    bar.classList.add('in-column');
  } else {
    document.querySelector('.app').appendChild(bar);
    bar.classList.remove('in-column');
  }
}
desktopMq.addEventListener('change', placeBar);

document.getElementById('confirmBtn').addEventListener('click', async () => {
  const chosen = state.filter((item) => item.selectedId);
  const items = chosen.map((item) => ({
    ingredient_id: item.selectedId,
    amount_grams: item.grams,
    detected_name: item.detected_name,
    liquid: !!item.liquid, // what this screen showed: a soup in ml, a solid in grams
  }));

  if (items.length === 0 && waterMl === 0) {
    showToast('No hay nada que confirmar todavía');
    return;
  }

  const payload = { items, meal, taken_at: takenAt };
  const btn = document.getElementById('confirmBtn');
  const errorBox = document.getElementById('saveError');
  errorBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  try {
    // Only water: nothing goes to the diary, it just fills the bar on the photo's day.
    const localDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const saved = items.length
      ? await apiPost('api/confirm', payload)
      : { created: [], date: localDay(takenAt ? new Date(takenAt) : new Date()), counts_for_streak: true };
    if (window.sfx) sfx.play(items.length ? (photos.length ? 'photo' : 'save') : 'water'); // the reward: a bell for the meal, a shutter + bell for a photo, a drop for water
    let waterLine = '';
    if (waterMl > 0) {
      try {
        const after = await addWater(saved.date, waterMl); // null when offline: queued and sent later
        waterLine = ` · +${cadenceUnits.fmtWater(waterMl)} de agua`;
        const goal = addWater.goal || 2000;
        if (after !== null && after - waterMl < goal && after >= goal) sessionStorage.setItem('cadence_water_goal', '1');
      } catch {
        waterLine = ' · no pude sumar el agua';
      }
    }
    // Each diary entry remembers its own zoomed crop (same order as the items we sent).
    // Photos and crops go to the server store; if that fails the plate is already saved in wger,
    // so keep a copy on this device and the diary moves it up on the next visit.
    try {
      await uploadMedia(saved.created, chosen, photos);
    } catch {
      await rememberThumbs(saved.created, chosen.map((item) => item.crop));
      try { await rememberPlate(saved.created, chosen, photos); } catch { /* the photo is a nicety */ }
    }
    clearScanSession();
    // Open the day the plate was filed under (the photo's day), and say where it went.
    const dayLabel = saved.date
      ? new Date(`${saved.date}T12:00:00`).toLocaleDateString('es', { day: 'numeric', month: 'long' })
      : 'tu diario';
    // An old photo fills its day but cannot extend (or bring back) a streak: say so, once.
    const flash = saved.counts_for_streak === false
      ? `Guardado en ${dayLabel}. Es un registro tardío: no suma a tu racha, que solo cuenta si registras el mismo día.`
      : `Guardado en ${dayLabel}`;
    const message = items.length ? flash + waterLine : `+${cadenceUnits.fmtWater(waterMl)} sumados a tu agua (${dayLabel})`;
    try {
      sessionStorage.setItem('cadence_flash', message);
      sessionStorage.setItem('cadence_flash_kind', saved.counts_for_streak === false ? 'warn' : 'ok');
    } catch { /* no flash */ }
    try { if (saved.date) sessionStorage.setItem('cadence_open_date', saved.date); } catch { /* no storage */ }
    // A beat before leaving, so the first notes are heard (the next page is a new document).
    setTimeout(() => leaveFlow(saved.date ? `index.html?date=${saved.date}` : 'index.html'), window.sfx && sfx.isOn() ? 420 : 0);
  } catch (err) {
    if (isNetworkFailure(err)) {
      // No connection: keep the plate and let the dashboard send it when we're back.
      queuePending(payload);
      clearScanSession();
      showToast('Sin conexión: tu plato se guardó y se enviará solo al volver.', 'warn');
      setTimeout(() => leaveFlow('index.html'), 1400);
      return;
    }
    // Shown twice on purpose: the toast disappears, the box stays until the next try.
    errorBox.textContent = `No se pudo guardar: ${err.message || 'error desconocido'}`;
    errorBox.classList.add('show');
    showToast(`No se pudo guardar: ${err.message || 'error desconocido'}`);
    btn.disabled = false;
    btn.innerHTML = 'Confirmar y registrar';
  }
});

async function init() {
  if (!meal) {
    // Suggest the slot of the photo's own time (the clock when it has none); outside
    // every window nothing is preselected. The user can always pick another meal.
    try {
      const suggestion = await apiGet(takenAt ? `api/meal-now?at=${encodeURIComponent(takenAt)}` : 'api/meal-now');
      if (suggestion.meal && suggestion.meal !== 'otro') { meal = suggestion.meal; mealSource = 'photo'; }
    } catch { /* picker simply starts empty */ }
  }
  renderPhotos();
  renderMealPick();
  renderItems();
  placeBar();
}
init();
</script>
