<style>
  .weight-cards { display: flex; gap: 10px; }
  .weight-card { flex: 1; background: var(--card); border: 1px solid var(--card-border); border-radius: 18px; padding: 14px; }
  .weight-card.goal { border-color: rgba(45,212,255,0.3); }
  .weight-card .t { font-size: 10.5px; color: var(--ink-soft); font-weight: 700; letter-spacing: 0.04em; margin-bottom: 6px; }
  .weight-card.goal .t { color: var(--accent-to); }
  .weight-card input { width: 100%; box-sizing: border-box; border: none; background: transparent; color: inherit; font-family: 'Space Mono', monospace; font-size: 21px; font-weight: 700; padding: 0; }
  .weight-card input:focus { outline: none; }
  .weight-card.goal input { color: var(--accent-to); }
  .pace-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 22px; padding: 18px; }
  .pace-card .t, .target-card .t { font-size: 10.5px; color: var(--ink-soft); font-weight: 700; letter-spacing: 0.06em; }
  .pace-big { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 14px; }
  .pace-big button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--card-border); background: transparent; color: var(--ink); font-size: 22px; cursor: pointer; }
  .pace-big .num { font-family: 'Space Mono', monospace; font-size: 42px; font-weight: 700; line-height: 1; }
  .pace-big .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; text-align: center; }
  .pace-chips { display: flex; gap: 8px; margin-top: 16px; }
  .pace-chips button { flex: 1; padding: 11px 4px; border-radius: 16px; border: 1.5px solid var(--card-border); background: var(--card); color: var(--ink); cursor: pointer; font-family: inherit; }
  .pace-chips button[aria-pressed="true"] { border-color: #4A8BFF; background: rgba(74,139,255,0.12); }
  .pace-chips b { display: block; font-size: 12px; }
  .pace-chips span { display: block; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; margin-top: 3px; }
  .target-card { background: linear-gradient(165deg, var(--card), var(--bg)); border: 1px solid var(--card-border); border-radius: 22px; padding: 18px; }
  .target-kcal { font-family: 'Space Mono', monospace; font-size: 36px; font-weight: 700; line-height: 1; margin-top: 8px; }
  .target-kcal small { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .proj { display: flex; gap: 8px; margin-top: 14px; }
  .proj div { flex: 1; text-align: center; padding: 10px 4px; border-radius: 14px; background: rgba(127,127,140,0.1); }
  .proj b { display: block; font-family: 'Space Mono', monospace; font-size: 13px; }
  .proj span { font-size: 10.5px; color: var(--ink-soft); }
  .macro-chips { display: flex; gap: 8px; margin-top: 12px; }
  .macro-chips div { flex: 1; background: rgba(127,127,140,0.1); border-radius: 12px; padding: 9px 4px; text-align: center; }
  .macro-chips b { display: block; font-family: 'Space Mono', monospace; font-size: 14px; }
  .macro-chips span { font-size: 9.5px; color: var(--ink-soft); font-weight: 700; }
  .pace-note { margin-top: 12px; padding: 11px 13px; border-radius: 13px; font-size: 12px; line-height: 1.45; }
  .pace-note.ok { background: rgba(61,220,132,0.10); border: 1px solid rgba(61,220,132,0.32); color: var(--good); }
  .pace-note.warn { background: rgba(255,170,64,0.12); border: 1px solid rgba(255,170,64,0.4); color: #C98A2B; }
  .nudge { display: none; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; }
  .nudge.open { display: flex; }
  .nudge button { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--card-border); background: var(--card); color: var(--ink); font-size: 20px; font-weight: 700; cursor: pointer; }
  .macro-edit { display: none; gap: 10px; }
  .macro-edit.open { display: flex; }
  .macro-edit label { flex: 1; }
</style>

<body class="with-shell" data-page="perfil">
<div class="app">
  <div class="page-head" style="padding:22px 20px 14px;display:flex;align-items:center;gap:12px;">
    <a href="profile.html" id="backLink" aria-label="Volver" class="icon-btn" style="width:36px;height:36px;border-radius:11px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
    <h1 class="disp" style="margin:0;font-size:17px;font-weight:700;">Tus objetivos</h1>
  </div>

  <div class="app-content" style="display:flex;flex-direction:column;gap:16px;padding-bottom:60px;">
    <div id="calBox"></div>
    <div class="meal-pick" id="goalPick" role="group" aria-label="Objetivo"></div>

    <div class="weight-cards">
      <div class="weight-card"><div class="t">PESO ACTUAL</div><div class="mono" style="font-size:21px;font-weight:700;"><span id="curWeight">–</span><span style="font-size:12px;color:var(--ink-soft);" id="curUnit"> kg</span></div></div>
      <label class="weight-card goal"><div class="t">META</div><div style="display:flex;align-items:baseline;gap:4px;"><input id="targetWeight" type="number" inputmode="decimal" min="1" max="700" step="0.1" placeholder="—"><span style="font-size:12px;color:var(--ink-soft);" id="tgtUnit">kg</span></div></label>
    </div>

    <div class="hl-card" id="dayCard" style="display:flex;align-items:center;gap:12px;">
      <div style="flex:1;min-width:0;"><div style="font-size:10.5px;color:var(--ink-soft);font-weight:700;letter-spacing:0.06em;">MI DÍA A DÍA</div><div id="dayText" style="font-size:13.5px;line-height:1.45;margin-top:4px;"></div></div>
      <button type="button" class="btn-quiet" id="dayEdit">Cambiar</button>
    </div>
    <div class="pace-note warn" id="blockNote" style="display:none;margin-top:0;"></div>

    <div class="pace-card" id="paceCard">
      <div class="t" id="paceTitle">MI RITMO</div>
      <div class="pace-big">
        <button type="button" id="paceLess" aria-label="Menos">−</button>
        <div><div class="num" id="paceNum">–</div><div class="sub" id="paceSub">al mes</div></div>
        <button type="button" id="paceMore" aria-label="Más">+</button>
      </div>
      <div class="pace-chips" id="paceChips"></div>
    </div>

    <div class="target-card">
      <div class="t" id="targetTitle">PARA LOGRARLO</div>
      <div class="target-kcal"><span id="kcal">–</span> <small>kcal al día</small></div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.45;" id="kcalLine"></div>
      <div class="proj" id="proj"></div>
      <div class="macro-chips">
        <div><b id="mP" style="color:#7C5CFF;">–</b><span>PROTEÍNA</span></div>
        <div><b id="mC" style="color:#2DD4FF;">–</b><span>CARBOS</span></div>
        <div><b id="mF" style="color:#FF8A5B;">–</b><span>GRASA</span></div>
      </div>
      <div class="pace-note ok" id="paceNote" style="display:none;"></div>
      <div class="nudge" id="nudge"><button type="button" id="less" aria-label="Menos calorías">−</button><span style="font-size:11.5px;color:var(--ink-soft);">Calorías a mano, de 50 en 50</span><button type="button" id="more" aria-label="Más calorías">+</button></div>
    </div>

    <button class="menu-row menu-card" id="howBtn" style="border-radius:18px;"><span class="label">Por qué este número<br><small style="color:var(--ink-soft);font-weight:500;font-size:12px;">Paso a paso, con tus datos y las fuentes</small></span><span class="chev">›</span></button>
    <button class="menu-row menu-card" id="askBtn" style="border-radius:18px;"><span class="label">Pregúntale a cadence<br><small style="color:var(--ink-soft);font-weight:500;font-size:12px;">Resuelve tus dudas con tus propios números</small></span><span class="chev">›</span></button>
    <button class="menu-row menu-card" id="manualBtn" style="border-radius:18px;"><span class="label">Prefiero fijar las calorías yo<br><small style="color:var(--ink-soft);font-weight:500;font-size:12px;">Ajuste manual de las calorías y los macros</small></span><span class="chev" id="manualChev">›</span></button>
    <div class="macro-edit" id="macroEdit">
      <label class="field"><span>PROTEÍNA g</span><input class="input" id="eP" type="number" inputmode="numeric" min="0" max="500"></label>
      <label class="field"><span>CARBOS g</span><input class="input" id="eC" type="number" inputmode="numeric" min="0" max="1000"></label>
      <label class="field"><span>GRASA g</span><input class="input" id="eF" type="number" inputmode="numeric" min="0" max="500"></label>
    </div>

    <div class="form-error" id="error" role="alert"></div>
    <button class="btn-primary" id="save">Guardar mi meta</button>
  </div>
</div>

<script src="static/js/icons.js"></script>
<script src="static/js/api.js"></script>
<script src="static/js/units.js"></script>
<script src="static/js/recorder.js"></script>
<script src="static/js/dictation.js"></script>
<script src="static/js/activity.js"></script>
<script src="static/js/assistant.js"></script>
<script src="static/js/theme.js"></script>
<script src="static/js/shell.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const U = cadenceUnits;
const GOALS = [['lose', 'Bajar'], ['maintain', 'Mantener'], ['gain', 'Subir'], ['muscle', 'Músculo']];
let me = null;
let goal = null;
let paceLb = 0;          // pounds per month in the direction of the goal (what the server speaks)
let kcal = 0;            // calories shown now (from the pace, or typed by hand)
let mode = 'keep';       // keep: what is saved now | pace: calculated from the pace | manual: calories chosen by hand
let plan = null;         // the last calculation (maintenance, projection, notes)
let macrosDirty = false; // the person typed macros by hand

// Pace in the person's own unit: pounds (steps of 0.5) or kilograms (steps of 0.25), per month.
let recPace = null;      // the server's recommended pace for this body and goal (lb a month)
const paceStep = () => (U.isLb() ? 0.5 : 0.25);
const roundPace = (v) => Math.max(paceStep(), Math.round(v / paceStep()) * paceStep());
const paceDefault = () => (recPace != null ? recPace : 0);
// Gentle / recommended / fastest SAFE pace for this body: the limit comes from the server.
const paceChoices = () => {
  const max = plan && plan.max_pace_lb_month;
  if (!max) return [];
  const rec = recPace != null ? recPace : max * 0.75;
  const list = [['Suave', rec * 0.5], ['Recomendado', rec], ['Rápido', max]].map(([label, lb]) => [label, Number(roundPace(U.paceValue(lb)).toFixed(2))]);
  return list.filter(([, v], i) => list.findIndex(([, w]) => w === v) === i);
};
const showError = (message) => { $('error').textContent = message || ''; $('error').classList.toggle('show', Boolean(message)); };
const paceText = (valueUnit) => `${Number(valueUnit.toFixed(1))} ${U.weightLabel()}`;

function fill(t) {
  kcal = t.kcal;
  $('kcal').textContent = Number(t.kcal).toLocaleString('es');
  $('mP').textContent = `${t.protein_g}g`;
  $('mC').textContent = `${t.carbs_g}g`;
  $('mF').textContent = `${t.fat_g}g`;
  $('eP').value = t.protein_g; $('eC').value = t.carbs_g; $('eF').value = t.fat_g;
}

function paint() {
  const blocked = Boolean(plan && plan.blocked);
  const moving = (goal === 'lose' || goal === 'gain' || goal === 'muscle') && !blocked;
  $('paceCard').style.display = moving ? 'block' : 'none';
  $('blockNote').style.display = blocked ? 'block' : 'none';
  if (blocked) $('blockNote').textContent = plan.note || '';
  paintDay();
  $('paceTitle').textContent = goal === 'lose' ? '¿CUÁNTO QUIERES BAJAR?' : '¿CUÁNTO QUIERES SUBIR?';
  const value = U.paceValue(paceLb);
  $('paceNum').textContent = Number(value.toFixed(1));
  $('paceSub').textContent = `${U.weightLabel() === 'lb' ? 'libras' : 'kilos'} al mes`;
  const choices = paceChoices();
  $('paceChips').innerHTML = choices.map(([label, v]) => `<button type="button" data-v="${v}" aria-pressed="${mode === 'pace' && Math.abs(v - value) < 0.05}"><b>${label}</b><span>${v} ${U.weightLabel()}</span></button>`).join('');
  $('paceChips').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => setPace(U.paceToLb(Number(b.dataset.v)))));
  const p = me.profile;
  const maintenance = plan && plan.maintenance_kcal;
  const change = plan && plan.change_lb_month;
  const span = plan && plan.maintenance_low ? ` (entre ${plan.maintenance_low.toLocaleString('es')} y ${plan.maintenance_high.toLocaleString('es')}: es una estimación)` : '';
  $('kcalLine').textContent = maintenance
    ? `Tu cuerpo gasta unas ${maintenance.toLocaleString('es')} kcal al día${span}. ${Math.abs(change) < 0.5 ? 'Con esto mantienes tu peso.' : change < 0 ? `Con esto bajas ${U.aboutChange(change)} al mes.` : `Con esto subes ${U.aboutChange(change)} al mes.`}`
    : '';
  const w = p.weight_kg;
  const proj = plan && plan.projection_kg;
  const lo = plan && plan.projection_low_kg, hi = plan && plan.projection_high_kg;
  $('proj').innerHTML = w && proj && Math.abs(change) >= 0.5 && !blocked
    ? [['en 1 mes', 0], ['en 2 meses', 1], ['en 3 meses', 2]].map(([l, i]) => `<div><b>${U.fmtWeight(proj[i])}</b><span>${l}${lo && hi ? `<br>${U.fmtWeight(Math.min(lo[i], hi[i]))} – ${U.fmtWeight(Math.max(lo[i], hi[i]))}` : ''}</span></div>`).join('') : '';
  const note = $('paceNote');
  if (plan && plan.note && !blocked) { note.textContent = plan.note; note.className = 'pace-note warn'; note.style.display = 'block'; }
  else if (moving && mode === 'pace' && plan && plan.max_pace_lb_month) { note.textContent = 'Es un ritmo seguro para tu peso y tu estatura. Las proyecciones son estimaciones: el peso real que registres manda.'; note.className = 'pace-note ok'; note.style.display = 'block'; }
  else note.style.display = 'none';
  $('curWeight').textContent = w != null ? Number(U.weightValue(w).toFixed(1)) : '–';
}

function renderGoals() {
  $('goalPick').innerHTML = GOALS.map(([key, label]) => `<button type="button" data-goal="${key}" aria-pressed="${key === goal}">${label}</button>`).join('');
  $('goalPick').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => changeGoal(b.dataset.goal)));
}

async function recalc(extra = {}, { silent = false } = {}) {
  const p = me.profile;
  try {
    const h = me.health || {};
    const t = await apiPost('api/plan/preview', {
      sex: p.sex, birthdate: p.birthdate, height_cm: p.height_cm, weight_kg: p.weight_kg || 70,
      activity: p.activity, lifestyle: p.lifestyle, steps: p.steps, training: p.training || [], lift_exp: p.lift_exp, body_fat_pct: p.body_fat_pct,
      health: { pregnancy: h.pregnancy || 0, lactation: h.lactation || 0, diabetes: Boolean(h.diabetes), kidney: Boolean(h.kidney), professional: Boolean(h.professional) },
      goal, ...extra,
    });
    plan = t;
    if (t.recommended_pace_lb_month != null) recPace = t.recommended_pace_lb_month;
    if (silent) { paint(); return; } // only to learn the limits and the projection: what is saved stays as it is
    fill(t);
    if (extra.pace_lb_month !== undefined && t.pace_lb_month != null) paceLb = t.pace_lb_month; // what was safe, if it was cut
    macrosDirty = false;
    paint();
  } catch (err) { showError(err.message); }
}

function setPace(lb) {
  mode = 'pace';
  paceLb = Math.max(0, Math.round(lb * 10) / 10);
  $('nudge').classList.remove('open');
  paint();
  recalc({ pace_lb_month: paceLb });
}

async function changeGoal(next) {
  goal = next;
  renderGoals();
  if (goal === 'maintain') { mode = 'pace'; paceLb = 0; await recalc({ pace_lb_month: 0 }); return; }
  await recalc({}, { silent: true }); // learns the recommended pace and the safe limit for this goal
  if (plan && plan.blocked) { mode = 'pace'; paceLb = 0; await recalc({ pace_lb_month: 0 }); return; }
  setPace(paceDefault());
}

$('paceLess').addEventListener('click', () => setPace(U.paceToLb(Math.max(paceStep(), U.paceValue(paceLb) - paceStep()))));
$('paceMore').addEventListener('click', () => setPace(U.paceToLb(U.paceValue(paceLb) + paceStep())));
const nudge = (delta) => () => { mode = 'manual'; recalc({ kcal: Math.max(800, Math.round((kcal + delta) / 10) * 10) }); };
$('less').addEventListener('click', nudge(-50));
$('more').addEventListener('click', nudge(50));
$('manualBtn').addEventListener('click', () => {
  const open = $('macroEdit').classList.toggle('open');
  $('nudge').classList.toggle('open', open);
  $('manualChev').textContent = open ? '⌄' : '›';
});
['eP', 'eC', 'eF'].forEach((id) => $(id).addEventListener('input', () => { macrosDirty = true; }));
$('backLink').addEventListener('click', (e) => {
  if (history.length > 1 && document.referrer.startsWith(window.location.origin)) { e.preventDefault(); history.back(); }
});

// "Mi día a día": what they told us about how they move. Changing it saves the answers (not the goal) and recalculates.
const LEVEL_TITLES = {};
apiGet('api/lifestyle').then((d) => d.levels.forEach((l) => { LEVEL_TITLES[l.key] = l.title; paintDay(); })).catch(() => {});
const KIND_LABELS = {};
function paintDay() {
  const p = me && me.profile;
  if (!p) return;
  const t = (p.training || []).map((x) => `${x.kind}`);
  const level = p.lifestyle ? (LEVEL_TITLES[p.lifestyle] || '') : 'Todavía no nos cuentas cómo es tu día';
  const train = p.training && p.training.length ? `${p.training.length} ${p.training.length === 1 ? 'ejercicio planificado' : 'ejercicios planificados'}` : 'Sin ejercicio planificado';
  const lift = (goal === 'muscle' || goal === 'gain') && !p.lift_exp ? '<br><span style="color:#C98A2B;">Cuéntanos cuánto llevas entrenando fuerza: define tu ritmo.</span>' : '';
  $('dayText').innerHTML = `${escapeHtml(level)}<br><span style="color:var(--ink-soft);">${train}${p.steps ? ` · ${p.steps.toLocaleString('es')} pasos` : ''}</span>${lift}`;
}
$('dayEdit').addEventListener('click', () => {
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim';
  const sheet = document.createElement('div');
  sheet.className = 'entry-sheet as-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.innerHTML = `<h3 class="disp" style="margin:0 0 4px;">Mi día a día</h3>
    <p class="ac-hint" style="margin:0 0 14px;">Cuéntanos con hechos cómo te mueves. Lo usamos para calcular lo que gasta tu cuerpo.</p>
    <div id="dayBox"></div>
    <div class="form-error" id="dayErr" style="margin-top:10px;"></div>
    <div class="sheet-actions"><button class="btn-quiet" id="dayCancel">Cancelar</button><button class="btn-primary" id="daySave">Guardar</button></div>`;
  document.body.append(scrim, sheet);
  pushOverlay(() => { scrim.remove(); sheet.remove(); });
  scrim.addEventListener('click', () => dismissOverlay());
  sheet.querySelector('#dayCancel').addEventListener('click', () => dismissOverlay());
  let ctl = null;
  const p = me.profile;
  cadenceActivity.mount(sheet.querySelector('#dayBox'), { chat: true, goal: () => goal, startWith: p.lifestyle ? 'form' : 'chat',
    value: { lifestyle: p.lifestyle, steps: p.steps, training: p.training, lift_exp: p.lift_exp, body_fat_pct: p.body_fat_pct } }).then((c) => { ctl = c; });
  sheet.querySelector('#daySave').addEventListener('click', async () => {
    const err = sheet.querySelector('#dayErr');
    const problem = ctl ? ctl.problem() : 'Un momento…';
    if (problem) { err.textContent = problem; err.classList.add('show'); return; }
    const a = ctl.read(); const h = me.health || {};
    try {
      me = await apiPut('api/profile', { sex: p.sex, birthdate: p.birthdate, height_cm: p.height_cm, weight_kg: p.weight_kg || 70, goal: me.profile.goal,
        target_weight_kg: p.target_weight_kg || undefined, ...a,
        health: { pregnancy: h.pregnancy || 0, lactation: h.lactation || 0, diabetes: Boolean(h.diabetes), kidney: Boolean(h.kidney), professional: Boolean(h.professional) }, keep_goal: true });
      rememberUser(me); swrClear();
      dismissOverlay(() => { showToast('Guardado: recalculamos tu plan', 'ok'); recalc(mode === 'pace' ? { pace_lb_month: paceLb } : { kcal: kcal }, { silent: false }); loadCalibration(); });
    } catch (e) { err.textContent = e.message || 'No se pudo guardar'; err.classList.add('show'); }
  });
});

// "Por qué este número": the steps with the person's own data, and where they come from.
$('howBtn').addEventListener('click', async () => {
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim';
  const sheet = document.createElement('div');
  sheet.className = 'entry-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.innerHTML = '<h3 class="disp">Por qué este número</h3><p class="ac-hint" style="margin-top:12px;">Un momento…</p>';
  document.body.append(scrim, sheet);
  pushOverlay(() => { scrim.remove(); sheet.remove(); });
  scrim.addEventListener('click', () => dismissOverlay());
  let e;
  try { e = await apiGet('api/plan/explain'); } catch (err) { sheet.innerHTML = `<h3 class="disp">Por qué este número</h3><p class="ac-hint" style="margin-top:12px;">${escapeHtml(err.message || 'No se pudo cargar')}</p><div class="sheet-actions"><button class="btn-primary" id="whyClose">Cerrar</button></div>`; sheet.querySelector('#whyClose').addEventListener('click', () => dismissOverlay()); return; }
  const b = e.breakdown;
  const n = (v) => Number(v).toLocaleString('es');
  const sign = (v) => (v > 0 ? `+${n(v)}` : n(v));
  const steps = [];
  steps.push([`Tu cuerpo en reposo<br><small>${b.resting_method === 'katch' ? 'Katch-McArdle, con tu % de grasa' : 'Fórmula Mifflin-St Jeor: sexo, edad, estatura y peso'}</small>`, `${n(b.resting_kcal)} kcal`]);
  steps.push([`Tu día a día${b.lifestyle && LEVEL_TITLES[b.lifestyle] ? `<br><small>${escapeHtml(LEVEL_TITLES[b.lifestyle])}</small>` : b.legacy ? '<br><small>Tu respuesta anterior de actividad</small>' : ''}`, `× ${String(b.pal).replace('.', ',')}`]);
  if (!b.legacy) steps.push([`Tu ejercicio planificado<br><small>Solo lo que gastas de más que sentado (no se cuenta dos veces)</small>`, `${sign(b.exercise_kcal)} kcal`]);
  if (b.tee_factor && b.tee_factor !== 1) steps.push([`Ajuste con tus propios datos<br><small>Lo que tu peso y tu comida enseñaron sobre tu cuerpo</small>`, `× ${String(b.tee_factor).replace('.', ',')}`]);
  steps.push([`Lo que gasta tu cuerpo<br><small>Entre ${n(e.maintenance_low)} y ${n(e.maintenance_high)}: las fórmulas aciertan con un margen de ±${e.calibrated ? 6 : 10} %</small>`, `${n(b.maintenance)} kcal`]);
  const goalWord = { lose: 'Para bajar de peso', muscle: 'Para ganar músculo', gain: 'Para subir de peso', maintain: 'Para mantener tu peso' }[me.profile.goal];
  steps.push([`${goalWord}${e.by_hand ? '<br><small>Calorías fijadas a mano</small>' : b.lift_exp && me.profile.goal === 'muscle' ? `<br><small>Por tu experiencia (${{ beginner: 'principiante', intermediate: 'intermedio', advanced: 'avanzado' }[b.lift_exp]}), no más de un 20 %</small>` : ''}`, `${sign(b.adjust_kcal)} kcal (${sign(b.adjust_pct).replace('.', ',')} %)`]);
  if (b.extra_kcal) steps.push(['Extra por embarazo o lactancia<br><small>Según las guías (IOM)</small>', `+${n(b.extra_kcal)} kcal`]);
  steps.push([`<b>Tu meta de hoy</b>`, `<b>${n(e.kcal)} kcal</b>`]);
  const lines = [];
  if (e.note) lines.push(e.note);
  lines.push(`Proteína: ${String(b.protein_per_kg).replace('.', ',')} g por kilo${b.protein_basis_kg !== me.profile.weight_kg ? ` (contados sobre ${U.fmtWeight(b.protein_basis_kg)}, un peso saludable para tu estatura)` : ''}. Grasa: cerca del 27 % de las calorías. Carbohidratos: el resto.`);
  lines.push(`Límites de seguridad: nunca menos de ${n(b.floor)} kcal, y el ritmo de bajada tiene un máximo según tu peso y tu estatura.`);
  sheet.innerHTML = `<h3 class="disp">Por qué este número</h3>
    <div style="margin-top:10px;">${steps.map(([l, v]) => `<div class="why-step"><span>${l}</span><b>${v}</b></div>`).join('')}</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">${lines.map((l) => `<p class="ac-hint">${escapeHtml(l)}</p>`).join('')}</div>
    <p class="ac-hint" style="margin-top:12px;"><b style="color:var(--ink);">Es una estimación, no una receta médica.</b> Nadie puede saber con exactitud cuánto gasta tu cuerpo sin medirlo. Por eso cadence compara con tu peso real y te propone ajustes.</p>
    <details style="margin-top:10px;"><summary class="ac-hint" style="cursor:pointer;">De dónde sale</summary>
      <ul style="margin:8px 0 0;padding-left:18px;">${e.sources.map((s2) => `<li class="ac-hint">${s2.url ? `<a href="${s2.url}" target="_blank" rel="noopener" style="color:var(--accent-to);">${escapeHtml(s2.title)}</a>` : escapeHtml(s2.title)}</li>`).join('')}</ul></details>
    <div class="sheet-actions"><button class="btn-quiet" id="whyAsk">Preguntar a cadence</button><button class="btn-primary" id="whyClose">Entendido</button></div>`;
  sheet.querySelector('#whyClose').addEventListener('click', () => dismissOverlay());
  sheet.querySelector('#whyAsk').addEventListener('click', () => dismissOverlay(() => cadenceAssistant.open({ prompt: '¿Por qué mi meta es esta?' })));
});
$('askBtn').addEventListener('click', () => cadenceAssistant.open());

// "Con tus datos": after a few weeks of weights and food, what their own body says. Only changes if they accept.
async function loadCalibration() {
  try {
    const c = await apiGet('api/calibration');
    const s = c.suggestion;
    if (!s) { $('calBox').innerHTML = ''; return; }
    const up = s.change_kcal > 0;
    $('calBox').innerHTML = `<div class="cal-card"><b class="big">Tus datos dicen otra cosa</b>
      <p>Con tus pesos y tus comidas de las últimas semanas, tu cuerpo parece gastar unas <b style="color:var(--ink);">${Number(c.observed_tee).toLocaleString('es')} kcal</b> (la fórmula decía ${Number(c.formula_tee).toLocaleString('es')}).
      Te proponemos ${up ? 'subir' : 'bajar'} tu meta de <b style="color:var(--ink);">${Number(me.targets.kcal).toLocaleString('es')}</b> a <b style="color:var(--ink);">${Number(s.goal_kcal).toLocaleString('es')} kcal</b> (${s.change_kcal > 0 ? '+' : ''}${s.change_kcal}), un paso pequeño. Solo cambia si tú aceptas.</p>
      <div class="cal-actions"><button type="button" class="btn-primary" id="calYes">Ajustar mi meta</button><button type="button" class="btn-quiet" id="calNo">Ahora no</button></div></div>`;
    $('calYes').addEventListener('click', async () => {
      try { me = await apiPost('api/calibration/apply', {}); rememberUser(me); swrClear(); if (window.sfx) sfx.play('save'); showToast('Meta ajustada con tus datos', 'ok'); setTimeout(() => window.location.reload(), 700); }
      catch (err) { showError(err.message); }
    });
    $('calNo').addEventListener('click', async () => { try { await apiPost('api/calibration/dismiss', {}); } catch { /* it asks again later */ } $('calBox').innerHTML = ''; });
  } catch { $('calBox').innerHTML = ''; }
}

$('save').addEventListener('click', async () => {
  showError('');
  $('save').disabled = true;
  const body = { goal };
  const target = $('targetWeight').value;
  if (target) body.target_weight_kg = Math.round(U.weightToKg(Number(target)) * 10) / 10;
  if (mode === 'pace') body.pace_lb_month = paceLb;       // calories come from the pace (inside what is safe)
  else body.kcal = kcal;                                   // kept as it was, or typed by hand
  if (macrosDirty || mode !== 'pace') { body.protein_g = Number($('eP').value); body.carbs_g = Number($('eC').value); body.fat_g = Number($('eF').value); }
  try {
    me = await apiPut('api/goals', body);
    rememberUser(me);
    showToast('Meta guardada', 'ok');
    setTimeout(() => (history.length > 1 ? history.back() : window.location.replace('profile.html')), 600);
  } catch (err) {
    showError(err.message);
    $('save').disabled = false;
  }
});

(async function init() {
  try { me = await ensureSession(); } catch { return; }
  const p = me.profile;
  goal = p.goal;
  $('curUnit').textContent = ` ${U.weightLabel()}`;
  $('tgtUnit').textContent = U.weightLabel();
  $('targetWeight').value = p.target_weight_kg ? Number(U.weightValue(p.target_weight_kg).toFixed(1)) : '';
  renderGoals();
  if (me.targets) {
    // What is saved now, translated: its pace in pounds (kept as is until the person touches the pace)
    const t = me.targets;
    const along = t.change_lb_month == null ? 0 : (goal === 'lose' ? -t.change_lb_month : t.change_lb_month);
    paceLb = me.pace_lb_month != null ? me.pace_lb_month : Math.max(0, Math.round(along * 2) / 2);
    mode = me.pace_lb_month != null ? 'pace' : 'keep';
    plan = { ...t, projection_kg: p.weight_kg && t.change_lb_month != null ? [1, 2, 3].map((m) => Math.round((p.weight_kg + t.change_lb_month / U.LB_PER_KG * m) * 10) / 10) : null };
    fill(t);
    paint();
    recalc(mode === 'pace' ? { pace_lb_month: paceLb } : { kcal: t.kcal }, { silent: true }); // learns the safe limit and the projection
  } else changeGoal(goal || 'lose');
  loadCalibration();
  paintDay();
})();
</script>
</body>
