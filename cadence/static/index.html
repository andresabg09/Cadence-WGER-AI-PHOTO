<script>
const WATER_GOAL_ML = 2000;
const WATER_STEP_ML = 250;
const MEAL_ICON_BG = {
  desayuno: 'linear-gradient(140deg, #3a2e22, #241c14)',
  almuerzo: 'linear-gradient(140deg, #c97b4a, #8a4e26)',
  merienda: 'linear-gradient(140deg, #6fa34a, #4c7a30)',
  cena: 'linear-gradient(140deg, #4a3826, #2e2015)',
  otro: 'linear-gradient(140deg, #555, #333)',
};
const ALWAYS_SHOWN = ['desayuno', 'almuerzo', 'cena'];
const ADD_MORE_LABEL = { desayuno: 'al desayuno', almuerzo: 'al almuerzo', merienda: 'a la merienda', cena: 'a la cena' };

document.getElementById('profileBtn').addEventListener('click', () => { window.location.href = 'profile.html'; });
document.getElementById('progressBtn').addEventListener('click', () => showToast('Progreso: próximamente', 'warn'));

function waterStorageKey(dateIso) {
  return `cadence_water_${dateIso}`;
}

function getWaterMl(dateIso) {
  return Number(localStorage.getItem(waterStorageKey(dateIso)) || 0);
}

function setWaterMl(dateIso, ml) {
  const clamped = Math.max(0, ml);
  localStorage.setItem(waterStorageKey(dateIso), String(clamped));
  renderWater(clamped);
}

function renderWater(ml) {
  document.getElementById('waterMl').textContent = ml;
  document.getElementById('bottleFill').style.height = `${Math.min(100, (ml / WATER_GOAL_ML) * 100)}%`;
  const filledTicks = Math.round((ml / WATER_GOAL_ML) * 4);
  const ticksWrap = document.getElementById('waterTicks');
  ticksWrap.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const tick = document.createElement('div');
    tick.style.cssText = `flex:1;height:5px;border-radius:100px;background:${i < filledTicks ? 'var(--accent-to)' : 'rgba(127,127,140,0.18)'};`;
    ticksWrap.appendChild(tick);
  }
}

function renderMacroBars(totals, goal) {
  const rows = [
    { label: 'PROTEÍNA', value: totals.protein_g, goal: goal.protein_g },
    { label: 'CARBOS', value: totals.carbs_g, goal: goal.carbs_g },
    { label: 'GRASA', value: totals.fat_g, goal: goal.fat_g },
  ];
  const wrap = document.getElementById('macroBars');
  wrap.innerHTML = '';
  rows.forEach((row) => {
    const pct = row.goal > 0 ? Math.min(100, (row.value / row.goal) * 100) : 0;
    const div = document.createElement('div');
    div.innerHTML = `
      <div class="macro-row">${row.label}</div>
      <div class="macro-track"><div class="macro-fill" style="width:${pct}%;"></div></div>
    `;
    wrap.appendChild(div);
  });
}

function renderRing(totals, goal) {
  const circumference = 2 * Math.PI * 47; // ~295.3
  const remaining = Math.max(0, goal.kcal - totals.kcal);
  const consumedRatio = goal.kcal > 0 ? Math.min(1, totals.kcal / goal.kcal) : 0;
  const dash = Math.max(4, consumedRatio * circumference); // keep a visible sliver even near 0
  document.getElementById('ringArc').setAttribute('stroke-dasharray', `${dash.toFixed(1)} ${circumference.toFixed(1)}`);
  document.getElementById('kcalLeft').textContent = Math.round(remaining);
}

function renderInsight(totals, goal) {
  const chip = document.getElementById('insightChip');
  const proteinRatio = goal.protein_g > 0 ? totals.protein_g / goal.protein_g : 1;
  if (proteinRatio < 0.6) {
    const pct = Math.round(proteinRatio * 100);
    document.getElementById('insightText').textContent =
      `te falta proteína para tu meta (vas en ${pct}%) — un snack con huevo o pollo te acercaría.`;
    chip.style.display = 'flex';
  } else {
    chip.style.display = 'none';
  }
}

function mealItemRow(item, mealKey) {
  const photo = item.has_crop ? `api/media/crop/${encodeURIComponent(item.diary_entry_id)}` : readThumbs()[item.diary_entry_id];
  const thumbStyle = photo
    ? `background-image:url('${photo}');background-size:cover;background-position:center;`
    : `background:${MEAL_ICON_BG[mealKey] || MEAL_ICON_BG.otro};`;
  return `
    <div class="swipe-row" data-entry-id="${item.diary_entry_id}">
      <button class="swipe-del" aria-label="Borrar ${escapeHtml(item.name)}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-9 0l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="swipe-content meal-item-row" style="padding:2px 0;">
        <div style="width:44px;height:44px;border-radius:14px;${thumbStyle}flex-shrink:0;position:relative;">
          <span style="position:absolute;bottom:-4px;right:-4px;background:var(--good);border-radius:100px;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:9px;border:2px solid var(--card);">✓</span>
        </div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;">${escapeHtml(item.name)}${(item.note || readNotes()[item.diary_entry_id]) ? '<span class="note-dot" title="Tiene una observación">📝</span>' : ''}</div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${Math.round(item.amount_grams)} g · ${Math.round(item.kcal)} kcal</div>
        </div>
        <button class="row-del" aria-label="Borrar ${escapeHtml(item.name)}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-9 0l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  `;
}

// Foods that came from one photo are shown together under that photo (a plate with 8 foods is
// ONE block, not 8 loose rows). A photo with a single food stays a plain row.
function plateGroupId(item) {
  if (!item.plate_key) return null;
  const cut = item.plate_key.lastIndexOf(':');
  return cut > 0 ? item.plate_key.slice(0, cut) : item.plate_key;
}

function mealRowsHtml(items, mealKey) {
  const order = [];
  const groups = new Map();
  items.forEach((item) => {
    const id = plateGroupId(item);
    if (id && !groups.has(id)) { groups.set(id, []); order.push({ group: id }); }
    if (id) groups.get(id).push(item);
    else order.push({ item });
  });
  return order.map((entry) => {
    if (entry.item) return mealItemRow(entry.item, mealKey);
    const members = groups.get(entry.group);
    if (members.length < 2) return mealItemRow(members[0], mealKey);
    const kcal = members.reduce((sum, it) => sum + it.kcal, 0);
    const photo = `api/media/plate/${encodeURIComponent(members[0].plate_key)}`;
    return `
      <div class="plate-group">
        <button type="button" class="pg-photo" data-photo="${photo}" aria-label="Ver la foto del plato" style="background-image:url('${photo}');">
          <span class="pg-chip">${members.length} alimentos · ${Math.round(kcal)} kcal</span>
        </button>
        ${members.map((it) => mealItemRow(it, mealKey)).join('')}
      </div>`;
  }).join('');
}

function mealCard(meal, key) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.display = 'flex';
  card.style.flexDirection = 'column';
  card.style.gap = '10px';
  const addLabel = ADD_MORE_LABEL[key];
  card.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;">
      <span style="font-size:11px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;">${escapeHtml(meal.label)}</span>
      <span style="font-size:11px;color:var(--ink-soft);font-weight:600;">${Math.round(meal.totals.kcal)} kcal</span>
    </div>
    ${mealRowsHtml(meal.items, key)}
    ${addLabel ? `
    <a href="search.html?meal=${key}" style="display:flex;align-items:center;gap:8px;padding:2px 0 0;color:var(--ink-soft);min-height:44px;">
      <span style="width:22px;height:22px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--accent-to);">+</span>
      <span style="font-size:12px;font-weight:600;">Agregar otro alimento ${addLabel}</span>
    </a>` : ''}
  `;
  return card;
}

function dashedAdd(label) {
  const link = document.createElement('a');
  link.href = `scan.html?meal=${label}`;
  link.className = 'dashed-add';
  link.innerHTML = `
    <span style="width:28px;height:28px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-to);">+</span>
    <span style="font-size:13px;font-weight:600;">Agregar ${label}</span>
  `;
  return link;
}

function renderMeals(meals) {
  const list = document.getElementById('mealsList');
  list.innerHTML = '';
  const byKey = Object.fromEntries(meals.map((m) => [m.key, m]));

  const container = document.createElement('div');
  container.style.cssText = 'display:flex;flex-direction:column;gap:10px;';

  if (meals.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <span style="font-size:36px;">🍽️</span>
        <h3 class="disp" style="margin:14px 0 6px;font-size:15.5px;font-weight:700;">${isViewingToday() ? 'Aún no registras nada hoy' : 'No hay nada registrado este día'}</h3>
        <p style="margin:0 0 18px;font-size:12px;color:var(--ink-soft);line-height:1.5;">${isViewingToday() ? 'Toma una foto de tu primer plato del día y empieza tu racha.' : 'Usa las flechas para ver otros días. Si subes la foto de un plato de ese día, se guarda en su fecha.'}</p>
        <a href="scan.html" class="btn-primary" style="display:inline-flex;width:auto;padding:13px 22px;">✨ Escanear un plato</a>
      </div>`;
    list.appendChild(container);
    return;
  }

  // Desayuno / almuerzo / cena always show (card or dashed "agregar", per the
  // mockup); merienda and otro only appear once something is logged in them.
  ['desayuno', 'almuerzo', 'merienda', 'cena', 'otro'].forEach((key) => {
    const meal = byKey[key];
    if (meal) container.appendChild(mealCard(meal, key));
    else if (ALWAYS_SHOWN.includes(key)) container.appendChild(dashedAdd(key));
  });

  list.appendChild(container);
  container.querySelectorAll('.pg-photo').forEach((btn) => btn.addEventListener('click', () => openLightbox(btn.dataset.photo, null)));
  wireSwipeToDelete();
}

function wireSwipeToDelete() {
  document.querySelectorAll('.swipe-row').forEach((row) => {
    const content = row.querySelector('.swipe-content');
    const delBtn = row.querySelector('.swipe-del');
    let startX = null;
    let swiped = false;

    content.addEventListener('pointerdown', (e) => { startX = e.clientX; swiped = false; });
    content.addEventListener('pointermove', (e) => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 8) swiped = true;
      if (dx < -20) content.classList.add('open');
      if (dx > 20) content.classList.remove('open');
    });
    content.addEventListener('click', (e) => {
      if (swiped || e.target.closest('.row-del')) return;
      if (content.classList.contains('open')) { content.classList.remove('open'); return; }
      openEntryDetail(row.dataset.entryId);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => {
      content.addEventListener(type, () => { startX = null; });
    });

    const remove = async () => {
      const entryId = row.dataset.entryId;
      try {
        await apiDelete(`api/diary/${entryId}`);
        row.remove();
        loadToday();
      } catch (err) {
        showToast(`No se pudo borrar: ${err.message}`);
      }
    };
    delBtn.addEventListener('click', remove);
    const rowDel = row.querySelector('.row-del');
    if (rowDel) rowDel.addEventListener('click', remove);
  });
}



// ---- Calendar: a flame on every day with something logged; its colour and number are the streak ----
const FLAME_PATH = 'M12 2c.7 3.2-1.3 4.9-3 6.8C7.4 10.6 6 12.4 6 15c0 3.3 2.7 6 6 6s6-2.7 6-6c0-2.3-1-3.9-2.2-5.1-.3 1.2-1 2-1.9 2.4.6-3.5-.6-7.4-1.9-10.3z';
const calCache = {};
const MONTH_NAMES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

// 1-2 ember, 3-6 orange, 7-13 red, 14-29 magenta (glow), 30+ violet (glow): more days in a row, hotter flame.
function flameTier(streak) {
  return streak >= 30 ? 5 : streak >= 14 ? 4 : streak >= 7 ? 3 : streak >= 3 ? 2 : 1;
}

function flameSvg(streak, size = 15) {
  return `<svg class="flame t${flameTier(streak)}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><path d="${FLAME_PATH}"/></svg>`;
}

function monthKey(date) { return date.slice(0, 7); }

function closeCalendar() {
  document.querySelectorAll('.cal-scrim, .cal-sheet').forEach((el) => el.remove());
}

async function openCalendar(selected, today) {
  closeCalendar();
  let month = monthKey(selected);
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim cal-scrim';
  const sheet = document.createElement('div');
  sheet.className = 'entry-sheet cal-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-label', 'Calendario');
  document.body.appendChild(scrim);
  document.body.appendChild(sheet);
  pushOverlay(closeCalendar);
  scrim.addEventListener('click', () => dismissOverlay());

  const render = (days, loading) => {
    const [year, mon] = month.split('-').map(Number);
    const first = new Date(year, mon - 1, 1);
    const lead = (first.getDay() + 6) % 7; // weeks start on Monday
    const total = new Date(year, mon, 0).getDate();
    const byDay = Object.fromEntries((days || []).map((d) => [d.date, d]));
    const cells = [];
    for (let i = 0; i < lead; i += 1) cells.push('<span class="cal-cell blank"></span>');
    for (let day = 1; day <= total; day += 1) {
      const iso = `${month}-${String(day).padStart(2, '0')}`;
      const info = byDay[iso];
      const future = iso > today;
      const cls = ['cal-cell', iso === selected ? 'selected' : '', iso === today ? 'today' : '', info ? 'has' : '', future ? 'future' : ''].join(' ');
      const late = info && info.streak === 0; // entries exist, but all were added after the day: no flame
      const aria = !info ? `${day}` : late ? `${day}, registrado después, sin racha` : `${day}, racha de ${info.streak} ${info.streak === 1 ? 'día' : 'días'}`;
      cells.push(`<button type="button" class="${cls}" data-date="${iso}" ${future ? 'disabled' : ''} aria-label="${aria}">
        <span class="cal-num">${day}</span>
        <span class="cal-flame">${!info ? '' : late ? '<i class="cal-late" title="Registrado después: no suma a la racha"></i>' : `${flameSvg(info.streak)}<b>${info.streak}</b>`}</span>
      </button>`);
    }
    const atCurrentMonth = month >= monthKey(today);
    sheet.innerHTML = `
      <div class="cal-head">
        <button type="button" class="nav-arrow" id="calPrev" aria-label="Mes anterior">‹</button>
        <div class="disp cal-title">${MONTH_NAMES[mon - 1]} ${year}${loading ? ' <span class="cal-loading">…</span>' : ''}</div>
        <button type="button" class="nav-arrow" id="calNext" aria-label="Mes siguiente" ${atCurrentMonth ? 'disabled' : ''}>›</button>
      </div>
      <div class="cal-grid cal-dow">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((d) => `<span>${d}</span>`).join('')}</div>
      <div class="cal-grid">${cells.join('')}</div>
      <div class="cal-legend">
        <span>${flameSvg(1, 12)} 1-2</span><span>${flameSvg(3, 12)} 3-6</span><span>${flameSvg(7, 12)} 7-13</span>
        <span>${flameSvg(14, 12)} 14-29</span><span>${flameSvg(30, 12)} 30+</span>
      </div>
      <p class="cal-note">El número es tu racha: días seguidos en que registraste <strong>ese mismo día</strong>. Si falta un día, vuelve a 1 y subir una foto vieja no la recupera. El punto gris <i class="cal-late"></i> marca un día con registros añadidos después.</p>
      <div class="sheet-actions"><button type="button" class="btn-primary" id="calToday">Ir a hoy</button></div>`;
    sheet.querySelector('#calPrev').addEventListener('click', () => shiftMonth(-1));
    sheet.querySelector('#calNext').addEventListener('click', () => shiftMonth(1));
    sheet.querySelector('#calToday').addEventListener('click', () => dismissOverlay(() => goToDate(today)));
    sheet.querySelectorAll('.cal-cell[data-date]').forEach((cell) => cell.addEventListener('click', () => {
      dismissOverlay(() => goToDate(cell.dataset.date));
    }));
  };

  const show = async () => {
    if (calCache[month]) { render(calCache[month], false); return; }
    render([], true);
    const shown = month;
    try {
      const data = await apiGet(`api/calendar?month=${shown}`);
      calCache[shown] = data.days;
    } catch { calCache[shown] = []; }
    if (shown === month && document.body.contains(sheet)) render(calCache[shown], false);
  };
  const shiftMonth = (delta) => {
    const [year, mon] = month.split('-').map(Number);
    const d = new Date(year, mon - 1 + delta, 1);
    month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    show();
  };
  show();
}


// ---- Streak panel: the run in progress, its days, and the ones before ----
function closeStreaks() {
  document.querySelectorAll('.streak-scrim, .streak-sheet').forEach((el) => el.remove());
}

function shortDay(iso) {
  return new Date(`${iso}T12:00:00`).toLocaleDateString('es', { day: 'numeric', month: 'short' }).replace(/\./g, '');
}

function dayWord(n) { return n === 1 ? 'día' : 'días'; }

async function openStreaks() {
  closeStreaks();
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim streak-scrim';
  const sheet = document.createElement('div');
  sheet.className = 'entry-sheet streak-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-label', 'Mi racha');
  sheet.innerHTML = '<div class="cal-loading" style="text-align:center;padding:30px 0;">Cargando tu racha…</div>';
  document.body.appendChild(scrim);
  document.body.appendChild(sheet);
  pushOverlay(closeStreaks);
  scrim.addEventListener('click', () => dismissOverlay());

  let data;
  try {
    data = await apiGet('api/streaks');
  } catch (err) {
    sheet.innerHTML = `<div class="save-error show" style="margin:0;">No pudimos cargar tu racha: ${escapeHtml(err.message)}</div>`;
    return;
  }
  const cur = data.current;
  const len = cur ? cur.length : 0;
  const hint = !cur
    ? 'No tienes una racha activa. Registra algo hoy y empieza una nueva: arranca en 1.'
    : data.logged_today
      ? 'Ya registraste hoy: tu racha sigue viva. Mañana suma otro día.'
      : 'Aún no registras hoy. Hazlo antes de que acabe el día para mantenerla; si no, vuelve a 1.';
  const chain = (data.current_days || []).map((iso, i) =>
    `<button type="button" class="chain-day" data-date="${iso}" aria-label="${shortDay(iso)}, día ${i + 1} de la racha">
       ${flameSvg(i + 1, 16)}<b>${i + 1}</b><span>${shortDay(iso)}</span></button>`).join('');
  const previous = data.previous.map((run) =>
    `<button type="button" class="run-row" data-date="${run.end}">
       ${flameSvg(run.length, 18)}
       <span class="run-len">${run.length} ${dayWord(run.length)}</span>
       <span class="run-range">${run.start === run.end ? shortDay(run.start) : `${shortDay(run.start)} – ${shortDay(run.end)}`}</span>
     </button>`).join('');

  sheet.innerHTML = `
    <div class="streak-hero">
      <div class="streak-big">${flameSvg(Math.max(len, 1), 46)}</div>
      <div>
        <div class="disp streak-count">${len} <small>${dayWord(len)}</small></div>
        <div class="when">${cur ? 'Racha actual' : 'Sin racha activa'}${data.best ? ` · mejor: ${data.best} ${dayWord(data.best)}` : ''}</div>
      </div>
    </div>
    <p class="cal-note" style="margin:10px 0 0;">${hint}</p>
    ${chain ? `<label class="field">DÍAS DE ESTA RACHA</label><div class="chain">${chain}</div>` : ''}
    ${previous ? `<label class="field">RACHAS ANTERIORES</label><div class="runs">${previous}</div>` : ''}
    <p class="cal-note">Solo cuenta registrar el mismo día: subir una foto vieja llena ese día pero no recupera la racha.</p>
    <div class="sheet-actions"><button type="button" class="btn-primary" id="streakCal">Ver calendario</button></div>`;
  sheet.querySelectorAll('[data-date]').forEach((el) => el.addEventListener('click', () => dismissOverlay(() => goToDate(el.dataset.date))));
  sheet.querySelector('#streakCal').addEventListener('click', () => {
    dismissOverlay(() => openCalendar(latestToday ? latestToday.date : data.today, data.today));
  });
}
document.getElementById('streakBtn').addEventListener('click', openStreaks);

// ---- Entry detail: photo, numbers, portion, meal and a note ----
const MEAL_CHOICES = [['desayuno', 'Desayuno'], ['almuerzo', 'Almuerzo'], ['merienda', 'Merienda'], ['cena', 'Cena']];

function findEntry(entryId) {
  if (!latestToday) return null;
  for (const meal of latestToday.meals) {
    const item = meal.items.find((i) => String(i.diary_entry_id) === String(entryId));
    if (item) return { item, mealKey: meal.key };
  }
  return null;
}

function portionStep(grams, direction) {
  const base = direction < 0 ? grams - 1 : grams;
  return base < 50 ? 5 : base < 200 ? 10 : 25;
}

function openLightbox(src, box) {
  const box_ = document.createElement('div');
  box_.className = 'lightbox';
  box_.innerHTML = `<button class="lb-close" aria-label="Cerrar">✕</button><div class="lb-scroll"><img alt="" src="${src}"></div>
    <div class="lb-hint">Toca la foto para acercar · pellizca para más zoom</div>`;
  document.body.appendChild(box_);
  pushOverlay(() => box_.remove());
  const scroller = box_.querySelector('.lb-scroll');
  const img = box_.querySelector('img');
  const centerOnZone = () => {
    const c = box ? [box[0] + box[2] / 2, box[1] + box[3] / 2] : [0.5, 0.5];
    scroller.scrollLeft = c[0] * img.clientWidth - scroller.clientWidth / 2;
    scroller.scrollTop = c[1] * img.clientHeight - scroller.clientHeight / 2;
  };
  img.addEventListener('click', () => { box_.classList.toggle('zoomed'); if (box_.classList.contains('zoomed')) centerOnZone(); });
  box_.querySelector('.lb-close').addEventListener('click', () => dismissOverlay());
}

function closeEntryDetail() {
  document.querySelectorAll('.sheet-scrim, .entry-sheet').forEach((el) => el.remove());
}

function openEntryDetail(entryId) {
  const found = findEntry(entryId);
  if (!found) return;
  const { item } = found;
  let grams = item.amount_grams;
  let mealKey = found.mealKey;
  const perGram = (value) => (item.amount_grams > 0 ? value / item.amount_grams : 0);
  const localPlate = readEntryPlate(entryId);
  const plate = item.plate_key
    ? { photo: `api/media/plate/${encodeURIComponent(item.plate_key)}`, box: item.box }
    : localPlate;
  const crop = item.has_crop ? `api/media/crop/${encodeURIComponent(entryId)}` : readThumbs()[entryId];
  const when = item.taken_at ? new Date(item.taken_at) : null;
  const whenText = when
    ? when.toLocaleString('es', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' })
    : '';

  closeEntryDetail();
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim';
  const sheet = document.createElement('div');
  sheet.className = 'entry-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-label', item.name);

  let photoHtml = '';
  if (plate) {
    const b = plate.box;
    const zone = b ? `<div class="zone" style="left:${b[0] * 100}%;top:${b[1] * 100}%;width:${b[2] * 100}%;height:${b[3] * 100}%;"></div>` : '';
    photoHtml = `<div class="plate-photo zoomable" id="sPhoto" role="button" aria-label="Ampliar la foto"><div class="plate-frame"><img alt="Foto del plato" src="${plate.photo}">${zone}</div><span class="zoom-hint">🔍 Toca para ampliar</span></div>`;
  } else if (crop) {
    photoHtml = `<div class="plate-photo zoomable" id="sPhoto" role="button" aria-label="Ampliar la foto"><img alt="Foto del alimento" src="${crop}" style="max-height:260px;"><span class="zoom-hint">🔍 Toca para ampliar</span></div>`;
  }

  sheet.innerHTML = `
    ${photoHtml}
    <div style="display:flex;align-items:center;gap:12px;">
      ${plate && crop ? `<img alt="" src="${crop}" style="width:64px;height:64px;border-radius:14px;object-fit:cover;flex-shrink:0;">` : ''}
      <div style="min-width:0;">
        <h3 class="disp">${escapeHtml(item.name)}</h3>
        <div class="when">${escapeHtml(whenText)}</div>
      </div>
    </div>
    <div class="macro-tiles">
      <div class="macro-tile"><b id="sKcal">0</b><span>KCAL</span></div>
      <div class="macro-tile"><b id="sProt">0</b><span>PROT g</span></div>
      <div class="macro-tile"><b id="sCarb">0</b><span>CARB g</span></div>
      <div class="macro-tile"><b id="sFat">0</b><span>GRASA g</span></div>
    </div>
    <label class="field">CANTIDAD</label>
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="step-btn remove" id="sMinus" aria-label="Menos">−</button>
      <span class="mono" id="sGrams" style="font-size:16px;font-weight:700;min-width:70px;text-align:center;"></span>
      <button class="step-btn add" id="sPlus" aria-label="Más">+</button>
    </div>
    <label class="field">COMIDA</label>
    <div class="meal-pick" id="sMeals" role="group" aria-label="Comida"></div>
    <label class="field" for="sNote">OBSERVACIÓN</label>
    <textarea id="sNote" placeholder="Ej.: con poca sal, porción del restaurante…"></textarea>
    <div class="sheet-actions">
      <button class="btn-danger" id="sDelete">Borrar</button>
      <button class="btn-primary" id="sSave">Guardar</button>
    </div>
    <div class="save-error" id="sError" role="alert" style="margin:10px 0 0;"></div>
  `;
  document.body.appendChild(scrim);
  document.body.appendChild(sheet);
  pushOverlay(closeEntryDetail);
  const $ = (id) => sheet.querySelector(`#${id}`);

  $('sNote').value = item.note || readNotes()[entryId] || '';
  const photoEl = $('sPhoto');
  if (photoEl) photoEl.addEventListener('click', () => openLightbox(plate ? plate.photo : crop, plate ? plate.box : null));

  const renderNumbers = () => {
    $('sGrams').textContent = `${Math.round(grams)} g`;
    $('sKcal').textContent = Math.round(perGram(item.kcal) * grams);
    $('sProt').textContent = (perGram(item.protein_g) * grams).toFixed(1);
    $('sCarb').textContent = (perGram(item.carbs_g) * grams).toFixed(1);
    $('sFat').textContent = (perGram(item.fat_g) * grams).toFixed(1);
  };
  const renderMeals = () => {
    $('sMeals').innerHTML = MEAL_CHOICES.map(([key, label]) =>
      `<button type="button" data-meal="${key}" aria-pressed="${key === mealKey}">${label}</button>`).join('');
    $('sMeals').querySelectorAll('button').forEach((btn) => btn.addEventListener('click', () => { mealKey = btn.dataset.meal; renderMeals(); }));
  };
  renderNumbers();
  renderMeals();

  $('sMinus').addEventListener('click', () => { grams = Math.max(5, grams - portionStep(grams, -1)); renderNumbers(); });
  $('sPlus').addEventListener('click', () => { grams = Math.min(2000, grams + portionStep(grams, 1)); renderNumbers(); });
  scrim.addEventListener('click', () => dismissOverlay());

  $('sDelete').addEventListener('click', async () => {
    try {
      await apiDelete(`api/diary/${entryId}`);
      dismissOverlay(loadToday);
    } catch (err) {
      $('sError').textContent = `No se pudo borrar: ${err.message}`;
      $('sError').classList.add('show');
    }
  });

  $('sSave').addEventListener('click', async () => {
    const btn = $('sSave');
    btn.disabled = true;
    $('sError').classList.remove('show');
    const changes = {};
    if (Math.round(grams) !== Math.round(item.amount_grams)) changes.amount_grams = Math.round(grams);
    if (mealKey !== found.mealKey) changes.meal = mealKey;
    try {
      const note = $('sNote').value;
      if (note.trim() !== (item.note || '')) await apiPut(`api/diary/${entryId}/note`, { note });
      if (Object.keys(changes).length) await apiPatch(`api/diary/${entryId}`, changes);
      dismissOverlay(loadToday);
    } catch (err) {
      btn.disabled = false;
      $('sError').textContent = `No se pudo guardar: ${err.message}`;
      $('sError').classList.add('show');
    }
  });
}

// Leaving to scan/search starts a flow that steps back to this entry when it ends (see api.js).
document.addEventListener('click', (e) => {
  const link = e.target.closest && e.target.closest('a[href]');
  if (link && /^(scan|search)\.html/.test(link.getAttribute('href'))) {
    try { sessionStorage.setItem(FROM_INDEX_KEY, '1'); } catch { /* no storage */ }
  }
});

let latestToday = null;
const syncedDays = new Set();

// Moves what this device still holds (older notes/photos) up to the server, once per day shown.
function syncExtrasOnce(data) {
  if (syncedDays.has(data.date)) return;
  syncedDays.add(data.date);
  const items = data.meals.flatMap((m) => m.items);
  if (!items.length) return;
  syncLocalExtras(items).then((moved) => { if (moved) loadToday(); });
}
let viewDate = new URLSearchParams(window.location.search).get('date'); // null = today

// Coming back from a finished flow: open the day the plate was filed under and say where it went.
function applyReturnHints() {
  try {
    const day = sessionStorage.getItem('cadence_open_date');
    if (day) {
      sessionStorage.removeItem('cadence_open_date');
      viewDate = day;
      const url = new URL(window.location.href);
      url.searchParams.set('date', day);
      history.replaceState(history.state, '', url);
    }
    const flash = sessionStorage.getItem('cadence_flash');
    if (flash) {
      const kind = sessionStorage.getItem('cadence_flash_kind') || 'ok';
      sessionStorage.removeItem('cadence_flash');
      sessionStorage.removeItem('cadence_flash_kind');
      showToast(flash, kind);
    }
  } catch { /* no storage */ }
}

function isViewingToday() {
  return !latestToday || !latestToday.today || latestToday.date === latestToday.today;
}

function shiftDate(iso, days) {
  const d = new Date(`${iso}T12:00:00`);
  d.setDate(d.getDate() + days);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function goToDate(iso) {
  viewDate = iso && latestToday && iso >= latestToday.today ? null : iso;
  const url = new URL(window.location.href);
  if (viewDate) url.searchParams.set('date', viewDate); else url.searchParams.delete('date');
  history.replaceState(null, '', url);
  loadToday();
}

function renderDayNav(data) {
  const label = document.getElementById('dayLabel');
  const labelText = document.getElementById('dayLabelText');
  const isToday = data.date === data.today;
  const yesterday = shiftDate(data.today, -1);
  labelText.textContent = isToday ? 'Hoy' : data.date === yesterday ? 'Ayer'
    : new Date(`${data.date}T12:00:00`).toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '');
  document.getElementById('dayNext').disabled = isToday;
  document.getElementById('dayPrev').onclick = () => goToDate(shiftDate(data.date, -1));
  document.getElementById('dayNext').onclick = () => goToDate(shiftDate(data.date, 1));
  label.onclick = () => openCalendar(data.date, data.today);
}

async function loadToday() {
  Object.keys(calCache).forEach((k) => delete calCache[k]);
  const dateLabel = document.getElementById('todayLabel');

  try {
    await flushPending().catch(() => {});
    const data = await apiGet(viewDate ? `api/today?date=${encodeURIComponent(viewDate)}` : 'api/today');
    latestToday = data;
    hideBanner('wger');
    renderDayNav(data);

    // Label from the server's "today" (user's timezone), not the device clock.
    dateLabel.textContent = new Date(`${data.date}T12:00:00`)
      .toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'short' })
      .replace(/\./g, '').replace(',', '').toUpperCase();
    document.getElementById('greeting').textContent = data.user_name ? `Hola, ${data.user_name}` : 'Hola';
    document.getElementById('streakValue').textContent = data.streak_days;
    document.getElementById('todayKcalLabel').textContent = `${Math.round(data.totals.kcal)} KCAL`;
    renderRing(data.totals, data.goal);
    renderMacroBars(data.totals, data.goal);
    renderInsight(data.totals, data.goal);
    renderMeals(data.meals);
    renderWater(getWaterMl(data.date));

    syncExtrasOnce(data);
    document.getElementById('waterPlus').onclick = () => setWaterMl(data.date, getWaterMl(data.date) + WATER_STEP_ML);
    document.getElementById('waterMinus').onclick = () => setWaterMl(data.date, getWaterMl(data.date) - WATER_STEP_ML);
  } catch (err) {
    if (!navigator.onLine) return; // the offline banner already explains it
    showBanner('wger', `No pudimos cargar tu diario: ${err.message}`, 'Reintentar', loadToday);
  }
}

(async function start() {
  // Signed in and set up, or on the way to the screen that fixes that.
  try { await ensureSession(); } catch { return; }
  applyReturnHints();
  loadToday();
})();
// Back from a flow can restore this page from the browser's memory: refresh what it shows.
window.addEventListener('pageshow', (e) => { if (e.persisted) { applyReturnHints(); loadToday(); } });

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
