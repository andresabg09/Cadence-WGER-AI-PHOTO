<script>
const waterStep = () => cadenceUnits.glassMl(); // a glass: 250 ml, or 8 oz (237 ml), as the person prefers
const waterGoalOf = (ml) => Math.max(2, Math.round((ml || 2000) / waterStep())) * waterStep(); // the goal in whole glasses
const MEAL_ICON_BG = {
  desayuno: 'linear-gradient(140deg, #3a2e22, #241c14)',
  almuerzo: 'linear-gradient(140deg, #c97b4a, #8a4e26)',
  merienda: 'linear-gradient(140deg, #6fa34a, #4c7a30)',
  cena: 'linear-gradient(140deg, #4a3826, #2e2015)',
  otro: 'linear-gradient(140deg, #555, #333)',
};
const ALWAYS_SHOWN = ['desayuno', 'almuerzo', 'cena'];
const ADD_MORE_LABEL = { desayuno: 'al desayuno', almuerzo: 'al almuerzo', merienda: 'a la merienda', cena: 'a la cena' };

document.getElementById('profileBtn').addEventListener('click', () => { window.location.href = 'profile.html'; });

// Water is the server's number for that day (shared by every device). Glasses of 250 ml: tapping one fills up to it
// (or empties back to the one before); the change shows at once and is confirmed with the server.
let waterInflight = 0;
async function changeWater(data, delta) {
  const before = data.water_ml || 0;
  const next = Math.max(0, before + delta);
  if (next === before) return;
  data.water_ml = next;
  renderWater(data);
  waterInflight += 1;
  try {
    const total = await addWater(data.date, next - before);
    if (total !== null && waterInflight === 1) { data.water_ml = total; renderWater(data); }
  } catch (err) {
    data.water_ml = before;
    renderWater(data);
    showToast(`No se pudo guardar el agua: ${err.message}`, 'error');
  } finally {
    waterInflight -= 1;
  }
}

// Drops fall one after another (never more than ~0.4 s in total) and the water rises when each one lands.
const WATER_LAND_MS = 240;
const waterStagger = (n) => Math.min(70, 400 / Math.max(1, n));
function playClass(el, cls, ms) {
  el.classList.remove(cls);
  void el.offsetWidth; // restart the animation if it is already running
  el.classList.add(cls);
  clearTimeout(el[`_t_${cls}`]);
  el[`_t_${cls}`] = setTimeout(() => el.classList.remove(cls), ms);
}

function renderWater(data) {
  const ml = data.water_ml || 0;
  const goal = waterGoalOf(data.water_goal_ml);
  const count = Math.min(16, Math.max(Math.ceil(goal / waterStep()), Math.ceil(ml / waterStep())));
  const nextEmpty = Math.floor(ml / waterStep());
  const wrap = document.getElementById('glasses');
  // Compared with what the glasses showed before (same day only), so a change plays out and a plain repaint does not.
  const prev = wrap.dataset.day === data.date && wrap.dataset.ml !== undefined ? Number(wrap.dataset.ml) : null;
  wrap.dataset.day = data.date;
  wrap.dataset.ml = ml;
  wrap._data = data;
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mlEl = document.getElementById('waterMl');
  const shownNum = (v) => String(cadenceUnits.waterNumber(v));
  mlEl.textContent = shownNum(ml);
  document.getElementById('waterGoal').textContent = shownNum(goal);
  document.getElementById('waterUnit').textContent = cadenceUnits.isOz() ? 'OZ' : 'ML';
  // The glasses are built once and then updated in place, so the water can rise and fall instead of being redrawn.
  if (wrap.children.length !== count) {
    wrap.innerHTML = Array.from({ length: count }, (_, i) => `<button type="button" class="glass-btn" data-i="${i}"><span class="glass"><i></i><b>+</b></span><u></u></button>`).join('');
    wrap.querySelectorAll('.glass-btn').forEach((btn) => btn.addEventListener('click', () => tapGlass(wrap._data, Number(btn.dataset.i))));
  }
  const fills = Array.from({ length: count }, (_, i) => Math.max(0, Math.min(1, (ml - i * waterStep()) / waterStep())));
  const olds = prev === null || still ? null : fills.map((_, i) => Math.max(0, Math.min(1, (prev - i * waterStep()) / waterStep())));
  const rising = olds ? fills.filter((f, i) => f > olds[i]).length : 0;
  const gap = waterStagger(rising);
  let k = 0;
  Array.from(wrap.children).forEach((btn, i) => {
    const fill = fills[i];
    const glass = btn.firstElementChild;
    const level = glass.firstElementChild;
    level.style.transitionDelay = '';
    if (olds && fill > olds[i]) {
      const d = k * gap;
      k += 1;
      btn.style.setProperty('--d', `${d}ms`);
      level.style.transitionDelay = `${d + WATER_LAND_MS - 20}ms`;
      playClass(btn, 'pour', d + 1100);
    } else if (olds && fill < olds[i]) {
      playClass(btn, 'drain', 500);
    }
    level.style.height = `${(fill * 100).toFixed(0)}%`;
    glass.classList.toggle('full', fill >= 1);
    glass.classList.toggle('has', fill > 0);
    glass.lastElementChild.style.display = i === nextEmpty && fill < 1 ? '' : 'none';
    btn.setAttribute('aria-label', `Vaso ${i + 1}${fill >= 1 ? ' lleno' : ''}`);
  });
  // Meta de agua: once the last drop lands, the whole row jumps in a wave.
  if (olds && prev < goal && ml >= goal) {
    const land = WATER_LAND_MS + Math.max(0, rising - 1) * gap;
    setTimeout(() => Array.from(wrap.children).forEach((btn, i) => { btn.style.setProperty('--d', `${i * 45}ms`); playClass(btn, 'cheer', i * 45 + 900); }), land + 480);
  }
  const extra = ml - goal;
  document.getElementById('waterHint').textContent = extra > 0 ? `+${cadenceUnits.fmtWater(extra)} sobre tu meta` : `Cada vaso son ${cadenceUnits.glassLabel()} · toca para llenar`;
}

function tapGlass(data, i) {
  const now = data.water_ml || 0;
  const goal = waterGoalOf(data.water_goal_ml);
  let target = (i + 1) * waterStep();
  if (now === target) target = i * waterStep(); // tapping the last full glass empties it
  const delta = target - now;
  if (!delta) return;
  changeWater(data, delta);
  if (!window.sfx) return;
  if (delta < 0) { sfx.play('tick'); return; }
  // The sound lands with the last drop; the goal chord waits for the water to settle.
  const drops = Math.max(1, Math.ceil(target / waterStep()) - Math.ceil(now / waterStep()));
  const land = WATER_LAND_MS + (drops - 1) * waterStagger(drops);
  if (now < goal && target >= goal) setTimeout(() => { sfx.play('goal'); showToast('¡Meta de agua cumplida!', 'ok'); }, land);
  else setTimeout(() => sfx.play('water'), WATER_LAND_MS);
}

function openWaterGoal(data) {
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim';
  const sheet = document.createElement('div');
  sheet.className = 'entry-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-label', 'Meta de agua');
  let goal = waterGoalOf(data.water_goal_ml);
  let auto = !!data.water_goal_auto;
  sheet.innerHTML = `<h3 class="disp">Meta de agua</h3>
    <p style="margin:6px 0 16px;font-size:12px;color:var(--ink-soft);line-height:1.5;">Por defecto calculamos según tu peso. Puedes poner la tuya, en vasos de ${cadenceUnits.glassLabel()}.</p>
    <div style="display:flex;align-items:center;justify-content:center;gap:16px;">
      <button class="step-btn remove" id="gMinus" aria-label="Menos">−</button>
      <div style="text-align:center;min-width:120px;"><div class="mono" id="gVal" style="font-size:26px;font-weight:700;"></div><div id="gSub" style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;"></div></div>
      <button class="step-btn add" id="gPlus" aria-label="Más">+</button>
    </div>
    <div class="sheet-actions"><button class="btn-secondary" id="gAuto">Automática</button><button class="btn-primary" id="gSave">Guardar</button></div>
    <div class="save-error" id="gErr" role="alert" style="margin:10px 0 0;"></div>`;
  document.body.append(scrim, sheet);
  pushOverlay(() => { scrim.remove(); sheet.remove(); });
  scrim.addEventListener('click', () => dismissOverlay());
  const $ = (id) => sheet.querySelector(`#${id}`);
  const paint = () => { $('gVal').textContent = cadenceUnits.fmtWater(goal); $('gSub').textContent = `${goal / waterStep()} vasos${auto ? ' · automática' : ''}`; };
  paint();
  $('gMinus').addEventListener('click', () => { goal = Math.max(2 * waterStep(), goal - waterStep()); auto = false; paint(); });
  $('gPlus').addEventListener('click', () => { goal = Math.min(8000, goal + waterStep()); auto = false; paint(); });
  const save = async (ml) => {
    try {
      const out = await apiPut('api/water/goal', { ml, step_ml: waterStep() });
      dismissOverlay(() => { data.water_goal_ml = out.goal_ml; data.water_goal_auto = ml === null; renderWater(data); });
    } catch (err) { const e = $('gErr'); e.textContent = err.message || 'No se pudo guardar'; e.classList.add('show'); }
  };
  $('gSave').addEventListener('click', () => save(goal));
  $('gAuto').addEventListener('click', () => save(null));
}

function renderMacroBars(totals, goal) {
  const rows = [
    { label: 'PROTEÍNA', value: totals.protein_g, goal: goal.protein_g },

  ];
  const wrap = document.getElementById('macroBars');

// "Restantes" shows what is left of the goal; "Por quemar" what is over it after the day's workouts (a guide, not a new goal).
let kcalMode = (() => { try { return localStorage.getItem('cadence_kcal_mode') === 'burn' ? 'burn' : 'left'; } catch { return 'left'; } })();

function renderRing(data) {
  const { totals, goal } = data;
  // "Por quemar" is a way to look at overeating while losing weight; for the other goals (gaining, keeping) there is nothing to burn.
  const burnAllowed = data.goal_type === 'lose';
  if (!burnAllowed) kcalMode = 'left';
  document.querySelector('.hero-card .seg-toggle').style.display = burnAllowed ? '' : 'none';
  const burn = burnAllowed ? data.burn : null;
  const circumference = 2 * Math.PI * 47; // ~295.3
  let ratio; let big; let caption; let overGoal = false;
  if (kcalMode === 'burn' && burn) {
    big = burn.kcal; caption = 'KCAL POR QUEMAR';
    ratio = burn.over_kcal > 0 ? Math.min(1, burn.worked_kcal / burn.over_kcal) : 0;
  } else {
    // Past the goal it must SAY by how much (it used to show 0, as if nothing had happened).
    const over = Math.round(totals.kcal - goal.kcal);
    overGoal = over > 0 && goal.kcal > 0;
    big = overGoal ? `+${over}` : Math.round(Math.max(0, goal.kcal - totals.kcal));
    caption = overGoal ? 'KCAL DE MÁS' : 'KCAL LIBRES';
    ratio = goal.kcal > 0 ? Math.min(1, totals.kcal / goal.kcal) : 0;
  }
  const arc = document.getElementById('ringArc');
  arc.setAttribute('stroke', overGoal ? 'var(--ember)' : 'url(#ringGrad)');
  arc.setAttribute('stroke-dasharray', `${Math.max(4, ratio * circumference).toFixed(1)} ${circumference.toFixed(1)}`);
  const num = document.getElementById('kcalLeft');
  num.textContent = big;
  num.style.color = overGoal ? 'var(--ember)' : '';
  document.getElementById('kcalCaption').textContent = caption;
  document.getElementById('modeLeft').setAttribute('aria-selected', String(kcalMode === 'left'));
  document.getElementById('modeBurn').setAttribute('aria-selected', String(kcalMode === 'burn'));
}

function renderPace(data) {

function renderInsight(data) {
  const { totals, goal } = data;
  const burn = data.goal_type === 'lose' ? data.burn : null;
  const chip = document.getElementById('insightChip');
  const text = document.getElementById('insightText');
  if (kcalMode === 'burn' && burn) {
    text.textContent = burn.over_kcal === 0
      ? 'vas dentro de tu meta, no hay nada por quemar. Es solo una guía: no cambia tu meta.'
      : `comiste ${burn.over_kcal} kcal sobre tu meta${burn.worked_kcal ? ` y tus entrenamientos ya quemaron ${burn.worked_kcal}` : ''}. ${burn.kcal ? `Un trote ligero de unos ${burn.minutes} minutos las compensa.` : 'Ya quedó compensado.'}`;
    chip.style.display = 'flex';

  }
  const proteinRatio = goal.protein_g > 0 ? totals.protein_g / goal.protein_g : 1;
  if (proteinRatio < 0.6) {

    text.textContent = `te falta proteína para tu meta (vas en ${pct}%) — un snack con huevo o pollo te acercaría.`;
    chip.style.display = 'flex';
  } else {
    chip.style.display = 'none';
  }
}

// Foods that came from one photo are shown together under that photo (a plate with 8 foods is
// ONE block, not 8 loose rows). A photo with a single food stays a plain row.
function plateGroupId(item) {
  if (!item.plate_key) return null;
  const cut = item.plate_key.lastIndexOf(':');
  return cut > 0 ? item.plate_key.slice(0, cut) : item.plate_key;
}

function mealRowsHtml(items, mealKey) {
  const order = [];
  const groups = new Map();
  items.forEach((item) => {
    const id = plateGroupId(item);
    if (id && !groups.has(id)) { groups.set(id, []); order.push({ group: id }); }
    if (id) groups.get(id).push(item);
    else order.push({ item });
  });
  return order.map((entry) => {
    if (entry.item) return mealItemRow(entry.item, mealKey);
    const members = groups.get(entry.group);
    if (members.length < 2) return mealItemRow(members[0], mealKey);
    const kcal = members.reduce((sum, it) => sum + it.kcal, 0);
    const photo = `api/media/plate/${encodeURIComponent(members[0].plate_key)}`;
    const ids = members.map((it) => it.diary_entry_id).join(',');
    return `
      <div class="plate-group" data-ids="${ids}" data-count="${members.length}" data-kcal="${Math.round(kcal)}">
        <div class="pg-swipe">
          <button type="button" class="pg-del" aria-label="Borrar todo el plato">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-9 0l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
            Borrar plato
          </button>
          <button type="button" class="pg-photo" data-photo="${photo}" aria-label="Ver la foto del plato" style="background-image:url('${photo}');">
            <span class="pg-chip">${members.length} alimentos · ${Math.round(kcal)} kcal</span>
          </button>
          <button type="button" class="pg-trash" aria-label="Borrar todo el plato (${members.length} alimentos)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-9 0l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        ${members.map((it) => mealItemRow(it, mealKey)).join('')}
      </div>`;
  }).join('');
}

function wireSwipeToDelete() {
  document.querySelectorAll('.swipe-row').forEach((row) => {
    const content = row.querySelector('.swipe-content');
    const delBtn = row.querySelector('.swipe-del');
    let startX = null;
    let swiped = false;

    content.addEventListener('pointerdown', (e) => { startX = e.clientX; swiped = false; });
    content.addEventListener('pointermove', (e) => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 8) swiped = true;
      if (dx < -20) content.classList.add('open');
      if (dx > 20) content.classList.remove('open');
    });
    content.addEventListener('click', (e) => {
      if (swiped || e.target.closest('.row-del')) return;
      if (content.classList.contains('open')) { content.classList.remove('open'); return; }
      openEntryDetail(row.dataset.entryId);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => {
      content.addEventListener(type, () => { startX = null; });
    });

    const remove = async () => {
      const entryId = row.dataset.entryId;
      try {
        await apiDelete(`api/diary/${entryId}`);
        if (window.sfx) sfx.play('remove');
        row.remove();
        loadToday();
      } catch (err) {
        showToast(`No se pudo borrar: ${err.message}`);
      }
    };
    delBtn.addEventListener('click', remove);
    const rowDel = row.querySelector('.row-del');
    if (rowDel) rowDel.addEventListener('click', remove);
  });
}



// A plate (everything one photo produced) can be deleted whole: the trash on its photo, or swiping the photo to the left.
// It asks first, because it removes several foods at once.
function wirePlateGroups() {
  document.querySelectorAll('.plate-group').forEach((group) => {
    const photo = group.querySelector('.pg-photo');
    let startX = null;
    let swiped = false;
    photo.addEventListener('pointerdown', (e) => { startX = e.clientX; swiped = false; });
    photo.addEventListener('pointermove', (e) => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 8) swiped = true;
      if (dx < -24) photo.classList.add('open');
      if (dx > 24) photo.classList.remove('open');
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => photo.addEventListener(type, () => { startX = null; }));
    photo.addEventListener('click', () => {
      if (swiped) return;
      if (photo.classList.contains('open')) { photo.classList.remove('open'); return; }
      openLightbox(photo.dataset.photo, null);
    });
    const ask = () => confirmDeletePlate(group.dataset.ids.split(','), Number(group.dataset.count), Number(group.dataset.kcal), photo);
    group.querySelector('.pg-del').addEventListener('click', ask);
    group.querySelector('.pg-trash').addEventListener('click', ask);
  });
}

function confirmDeletePlate(ids, count, kcal, photoEl) {
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim';
  const sheet = document.createElement('div');
  sheet.className = 'entry-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-label', 'Borrar el plato');
  sheet.innerHTML = `<h3 class="disp">¿Borrar todo el plato?</h3>
    <p style="margin:8px 0 16px;font-size:13px;color:var(--ink-soft);line-height:1.5;">Se borran los ${count} alimentos de esta foto (${kcal} kcal) del diario. Si solo sobra uno, bórralo desde su fila.</p>
    <div class="save-error" id="pdErr" role="alert"></div>
    <div class="sheet-actions"><button type="button" class="btn-secondary" id="pdNo">Cancelar</button><button type="button" class="btn-danger" id="pdYes">Borrar los ${count}</button></div>`;
  document.body.append(scrim, sheet);
  pushOverlay(() => { scrim.remove(); sheet.remove(); if (photoEl) photoEl.classList.remove('open'); });
  scrim.addEventListener('click', () => dismissOverlay());
  sheet.querySelector('#pdNo').addEventListener('click', () => dismissOverlay());
  sheet.querySelector('#pdYes').addEventListener('click', async (e) => {
    e.currentTarget.disabled = true;
    try {
      await apiPost('api/diary/bulk-delete', { ids });
      swrClear();
      if (window.sfx) sfx.play('remove');
      dismissOverlay(loadToday);
    } catch (err) {
      e.currentTarget.disabled = false;
      const box = sheet.querySelector('#pdErr');
      box.textContent = `No se pudo borrar: ${err.message}`;
      box.classList.add('show');
    }
  });
}

// ---- Calendar: a flame on every day with something logged; its colour and number are the streak ----
const calCache = {};
const MONTH_NAMES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

function monthKey(date) { return date.slice(0, 7); }

function closeCalendar() {
  document.querySelectorAll('.cal-scrim, .cal-sheet').forEach((el) => el.remove());
}

async function openCalendar(selected, today, startMonth) {
  closeCalendar();
  let month = startMonth || monthKey(selected);
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim cal-scrim';
  const sheet = document.createElement('div');
  sheet.className = 'entry-sheet cal-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-label', 'Calendario');
  document.body.appendChild(scrim);
  document.body.appendChild(sheet);
  pushOverlay(closeCalendar);
  scrim.addEventListener('click', () => dismissOverlay());

  const render = (days, loading) => {
    const [year, mon] = month.split('-').map(Number);
    const first = new Date(year, mon - 1, 1);
    const lead = (first.getDay() + 6) % 7; // weeks start on Monday
    const total = new Date(year, mon, 0).getDate();
    const byDay = Object.fromEntries((days || []).map((d) => [d.date, d]));
    const cells = [];
    for (let i = 0; i < lead; i += 1) cells.push('<span class="cal-cell blank"></span>');
    for (let day = 1; day <= total; day += 1) {
      const iso = `${month}-${String(day).padStart(2, '0')}`;
      const info = byDay[iso];
      const future = iso > today;
      const cls = ['cal-cell', iso === selected ? 'selected' : '', iso === today ? 'today' : '', info ? 'has' : '', future ? 'future' : ''].join(' ');
      const late = info && info.streak === 0; // entries exist, but all were added after the day: no flame
      const aria = !info ? `${day}` : late ? `${day}, registrado después, sin racha` : `${day}, racha de ${info.streak} ${info.streak === 1 ? 'día' : 'días'}`;
      cells.push(`<button type="button" class="${cls}" data-date="${iso}" ${future ? 'disabled' : ''} aria-label="${aria}">
        <span class="cal-num">${day}</span>
        <span class="cal-flame">${!info ? '' : late ? '<i class="cal-late" title="Registrado después: no suma a la racha"></i>' : `${flameSvg(info.streak)}<b>${info.streak}</b>`}</span>
      </button>`);
    }
    const atCurrentMonth = month >= monthKey(today);
    sheet.innerHTML = `
      <div class="cal-head">
        <button type="button" class="nav-arrow" id="calPrev" aria-label="Mes anterior">‹</button>
        <div class="disp cal-title">${MONTH_NAMES[mon - 1]} ${year}${loading ? ' <span class="cal-loading">…</span>' : ''}</div>
        <button type="button" class="nav-arrow" id="calNext" aria-label="Mes siguiente" ${atCurrentMonth ? 'disabled' : ''}>›</button>
      </div>
      <div class="cal-grid cal-dow">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((d) => `<span>${d}</span>`).join('')}</div>
      <div class="cal-grid">${cells.join('')}</div>
      <div class="cal-legend">
        <span>${flameSvg(1, 12)} 1-2</span><span>${flameSvg(3, 12)} 3-6</span><span>${flameSvg(7, 12)} 7-13</span>
        <span>${flameSvg(14, 12)} 14-29</span><span>${flameSvg(30, 12)} 30+</span>
      </div>
      <p class="cal-note">El número es tu racha: días seguidos en que registraste <strong>ese mismo día</strong>. Si falta un día, vuelve a 1 y subir una foto vieja no la recupera. El punto gris <i class="cal-late"></i> marca un día con registros añadidos después.</p>
      <div class="sheet-actions"><button type="button" class="btn-primary" id="calToday">Ir a hoy</button></div>`;
    sheet.querySelector('#calPrev').addEventListener('click', () => shiftMonth(-1));
    sheet.querySelector('#calNext').addEventListener('click', () => shiftMonth(1));
    sheet.querySelector('#calToday').addEventListener('click', () => dismissOverlay(() => goToDate(today)));
    sheet.querySelectorAll('.cal-cell[data-date]').forEach((cell) => cell.addEventListener('click', () => {
      dismissOverlay(() => goToDate(cell.dataset.date));
    }));
  };

  const show = async () => {
    if (calCache[month]) { render(calCache[month], false); return; }
    render([], true);
    const shown = month;
    try {
      const data = await apiGet(`api/calendar?month=${shown}`);
      calCache[shown] = data.days;
    } catch { calCache[shown] = []; }
    if (shown === month && document.body.contains(sheet)) render(calCache[shown], false);
  };
  const shiftMonth = (delta) => {
    const [year, mon] = month.split('-').map(Number);
    const d = new Date(year, mon - 1 + delta, 1);
    month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    show();
  };
  show();
}


// ---- Streak panel: the run in progress, its days, and the ones before ----
function closeStreaks() {
  document.querySelectorAll('.streak-scrim, .streak-sheet').forEach((el) => el.remove());
}

function shortDay(iso) {
  return new Date(`${iso}T12:00:00`).toLocaleDateString('es', { day: 'numeric', month: 'short' }).replace(/\./g, '');
}

function dayWord(n) { return n === 1 ? 'día' : 'días'; }

async function openStreaks() {
  closeStreaks();
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim streak-scrim';

    ? 'No tienes una racha activa. Registra algo hoy y empieza una nueva: arranca en 1.'
    : data.logged_today
      ? 'Ya registraste hoy: tu racha sigue viva. Mañana suma otro día.'
      : 'Aún no registras hoy. Hazlo antes de que acabe el día para mantenerla; si no, vuelve a 1.';
  const chain = (data.current_days || []).map((iso, i) =>

       ${flameSvg(i + 1, 16)}<b>${i + 1}</b><span>${shortDay(iso)}</span></button>`).join('');
  const previous = data.previous.map((run) =>
    `<button type="button" class="run-row" data-date="${run.end}">
       ${flameSvg(run.length, 18)}
       <span class="run-len">${run.length} ${dayWord(run.length)}</span>
       <span class="run-range">${run.start === run.end ? shortDay(run.start) : `${shortDay(run.start)} – ${shortDay(run.end)}`}</span>
     </button>`).join('');

  sheet.innerHTML = `
    <div class="streak-hero">
      <div class="streak-big">${flameSvg(Math.max(len, 1), 46)}</div>
      <div>
        <div class="disp streak-count">${len} <small>${dayWord(len)}</small></div>
        <div class="when">${cur ? 'Racha actual' : 'Sin racha activa'}${data.best ? ` · mejor: ${data.best} ${dayWord(data.best)}` : ''}</div>

    <p class="cal-note" style="margin:10px 0 0;">${hint}</p>
    ${chain ? `<label class="field">DÍAS DE ESTA RACHA</label><div class="chain">${chain}</div>` : ''}
    ${previous ? `<label class="field">RACHAS ANTERIORES</label><div class="runs">${previous}</div>` : ''}
    <p class="cal-note">Solo cuenta registrar el mismo día: subir una foto vieja llena ese día pero no recupera la racha.</p>
    <div class="sheet-actions"><button type="button" class="btn-primary" id="streakCal">Ver calendario</button></div>`;
  sheet.querySelectorAll('[data-date]').forEach((el) => el.addEventListener('click', () => dismissOverlay(() => goToDate(el.dataset.date))));
  sheet.querySelector('#streakCal').addEventListener('click', () => {
    dismissOverlay(() => openCalendar(latestToday ? latestToday.date : data.today, data.today));

document.getElementById('streakBtn').addEventListener('click', () => {

// ---- Entry detail: photo, numbers, portion, meal and a note ----
const MEAL_CHOICES = [['desayuno', 'Desayuno'], ['almuerzo', 'Almuerzo'], ['merienda', 'Merienda'], ['cena', 'Cena']];

function findEntry(entryId) {
  if (!latestToday) return null;
  for (const meal of latestToday.meals) {
    const item = meal.items.find((i) => String(i.diary_entry_id) === String(entryId));
    if (item) return { item, mealKey: meal.key };
  }
  return null;
}

function portionStep(grams, direction) {
  const base = direction < 0 ? grams - 1 : grams;
  return base < 50 ? 5 : base < 200 ? 10 : 25;
}

function openLightbox(src, box) {
  const box_ = document.createElement('div');
  box_.className = 'lightbox';
  // The zone is drawn on the frame that wraps the photo exactly, so it stays on the ingredient when zoomed in.
  const zone = box ? `<div class="zone" style="left:${box[0] * 100}%;top:${box[1] * 100}%;width:${box[2] * 100}%;height:${box[3] * 100}%;"></div>` : '';
  box_.innerHTML = `<button class="lb-close" aria-label="Cerrar"><i data-ico="x"></i></button><div class="lb-scroll"><div class="lb-frame"><img alt="" src="${src}">${zone}</div></div>
    <div class="lb-hint">Toca la foto para acercar · pellizca para más zoom</div>`;
  document.body.appendChild(box_);
  const scroller = box_.querySelector('.lb-scroll');
  const frame = box_.querySelector('.lb-frame');
  const img = box_.querySelector('img');
  const fit = () => { // the photo as large as fits the screen, in px, so the frame is exactly the photo
    if (!img.naturalWidth) return;
    const k = Math.min(scroller.clientWidth / img.naturalWidth, scroller.clientHeight / img.naturalHeight);
    frame.style.setProperty('--fit', `${Math.round(img.naturalWidth * k)}px`);
  };
  const watch = window.ResizeObserver ? new ResizeObserver(fit) : null;
  if (watch) watch.observe(scroller);
  img.addEventListener('load', fit);
  if (img.complete) fit();
  pushOverlay(() => { if (watch) watch.disconnect(); box_.remove(); });
  const centerOnZone = () => {
    const c = box ? [box[0] + box[2] / 2, box[1] + box[3] / 2] : [0.5, 0.5];
    scroller.scrollLeft = c[0] * frame.clientWidth - scroller.clientWidth / 2;
    scroller.scrollTop = c[1] * frame.clientHeight - scroller.clientHeight / 2;
  };
  img.addEventListener('click', () => { box_.classList.toggle('zoomed'); if (box_.classList.contains('zoomed')) centerOnZone(); });
  box_.querySelector('.lb-close').addEventListener('click', () => dismissOverlay());
}

function closeEntryDetail() {
  document.querySelectorAll('.sheet-scrim, .entry-sheet').forEach((el) => el.remove());
}

function openEntryDetail(entryId) {
  const found = findEntry(entryId);
  if (!found) return;
  const { item } = found;
  let grams = item.amount_grams;
  let mealKey = found.mealKey;
  const perGram = (value) => (item.amount_grams > 0 ? value / item.amount_grams : 0);
  const localPlate = readEntryPlate(entryId);
  const plate = item.plate_key
    ? { photo: `api/media/plate/${encodeURIComponent(item.plate_key)}`, box: item.box }
    : localPlate;
  const crop = item.has_crop ? `api/media/crop/${encodeURIComponent(entryId)}` : readThumbs()[entryId];
  const when = item.taken_at ? new Date(item.taken_at) : null;
  const whenText = when
    ? when.toLocaleString('es', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' })
    : '';

  closeEntryDetail();
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim';
  const sheet = document.createElement('div');
  sheet.className = 'entry-sheet';

  if (plate) {
    const b = plate.box;
    const zone = b ? `<div class="zone" style="left:${b[0] * 100}%;top:${b[1] * 100}%;width:${b[2] * 100}%;height:${b[3] * 100}%;"></div>` : '';
    photoHtml = `<div class="plate-photo zoomable" id="sPhoto" role="button" aria-label="Ampliar la foto"><div class="plate-frame"><img alt="Foto del plato" src="${plate.photo}">${zone}</div><span class="zoom-hint"><i data-ico="magnifying-glass"></i> Toca para ampliar</span></div>`;
  } else if (crop) {
    photoHtml = `<div class="plate-photo zoomable" id="sPhoto" role="button" aria-label="Ampliar la foto"><img alt="Foto del alimento" src="${crop}" style="max-height:260px;"><span class="zoom-hint"><i data-ico="magnifying-glass"></i> Toca para ampliar</span></div>`;
  }

  sheet.innerHTML = `
    ${photoHtml}
    <div style="display:flex;align-items:center;gap:12px;">
      ${plate && crop ? `<img alt="" src="${crop}" style="width:64px;height:64px;border-radius:14px;object-fit:cover;flex-shrink:0;">` : ''}
      <div style="min-width:0;">
        <h3 class="disp">${escapeHtml(item.name)}</h3>
        <div class="when">${escapeHtml(whenText)}</div>
      </div>
    </div>
    <div class="macro-tiles">
      <div class="macro-tile"><b id="sKcal">0</b><span>KCAL</span></div>
      <div class="macro-tile"><b id="sProt">0</b><span>PROT g</span></div>
      <div class="macro-tile"><b id="sCarb">0</b><span>CARB g</span></div>
      <div class="macro-tile"><b id="sFat">0</b><span>GRASA g</span></div>
    </div>
    <label class="field">CANTIDAD</label>
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="step-btn remove" id="sMinus" aria-label="Menos">−</button>
      <span class="mono" id="sGrams" style="font-size:16px;font-weight:700;min-width:70px;text-align:center;"></span>
      <button class="step-btn add" id="sPlus" aria-label="Más">+</button>
    </div>
    <label class="field">COMIDA</label>
    <div class="meal-pick" id="sMeals" role="group" aria-label="Comida"></div>
    <label class="field" for="sNote">OBSERVACIÓN</label>
    <textarea id="sNote" placeholder="Ej.: con poca sal, porción del restaurante…"></textarea>
    <div class="sheet-actions">
      <button class="btn-danger" id="sDelete">Borrar</button>
      <button class="btn-primary" id="sSave">Guardar</button>
    </div>
    <div class="save-error" id="sError" role="alert" style="margin:10px 0 0;"></div>
  `;
  document.body.appendChild(scrim);
  document.body.appendChild(sheet);
  pushOverlay(closeEntryDetail);
  const $ = (id) => sheet.querySelector(`#${id}`);

  $('sNote').value = item.note || readNotes()[entryId] || '';
  const photoEl = $('sPhoto');
  if (photoEl) photoEl.addEventListener('click', () => openLightbox(plate ? plate.photo : crop, plate ? plate.box : null));

  const renderNumbers = () => {
    $('sGrams').textContent = cadenceUnits.fmtAmount(grams, item.liquid);
    $('sKcal').textContent = Math.round(perGram(item.kcal) * grams);
    $('sProt').textContent = (perGram(item.protein_g) * grams).toFixed(1);
    $('sCarb').textContent = (perGram(item.carbs_g) * grams).toFixed(1);
    $('sFat').textContent = (perGram(item.fat_g) * grams).toFixed(1);
  };
  const renderMeals = () => {
    $('sMeals').innerHTML = MEAL_CHOICES.map(([key, label]) =>
      `<button type="button" data-meal="${key}" aria-pressed="${key === mealKey}">${label}</button>`).join('');
    $('sMeals').querySelectorAll('button').forEach((btn) => btn.addEventListener('click', () => { mealKey = btn.dataset.meal; renderMeals(); }));
  };
  renderNumbers();
  renderMeals();

  const stepOf = (dir) => (item.liquid ? cadenceUnits.liquidStep(portionStep(grams, dir)) : portionStep(grams, dir));
  $('sMinus').addEventListener('click', () => { grams = Math.max(5, grams - stepOf(-1)); renderNumbers(); });
  $('sPlus').addEventListener('click', () => { grams = Math.min(2000, grams + stepOf(1)); renderNumbers(); });
  scrim.addEventListener('click', () => dismissOverlay());

  $('sDelete').addEventListener('click', async () => {
    try {
      await apiDelete(`api/diary/${entryId}`);
      if (window.sfx) sfx.play('remove');
      dismissOverlay(loadToday);
    } catch (err) {
      $('sError').textContent = `No se pudo borrar: ${err.message}`;
      $('sError').classList.add('show');
    }
  });

  $('sSave').addEventListener('click', async () => {
    const btn = $('sSave');
    btn.disabled = true;
    $('sError').classList.remove('show');
    const changes = {};
    if (Math.round(grams) !== Math.round(item.amount_grams)) changes.amount_grams = Math.round(grams); // grams (or ml: 1 ml = 1 g)
    if (mealKey !== found.mealKey) changes.meal = mealKey;
    try {
      const note = $('sNote').value;
      if (note.trim() !== (item.note || '')) await apiPut(`api/diary/${entryId}/note`, { note });
      if (Object.keys(changes).length) await apiPatch(`api/diary/${entryId}`, changes);
      dismissOverlay(loadToday);
    } catch (err) {
      btn.disabled = false;
      $('sError').textContent = `No se pudo guardar: ${err.message}`;
      $('sError').classList.add('show');
    }
  });
}

// Leaving to scan/search starts a flow that steps back to this entry when it ends (see api.js).
document.addEventListener('click', (e) => {
  const link = e.target.closest && e.target.closest('a[href]');
  if (link && /^(scan|search)\.html/.test(link.getAttribute('href'))) {
    try { sessionStorage.setItem(FROM_INDEX_KEY, '1'); } catch { /* no storage */ }
  }
});

let latestToday = null;
const syncedDays = new Set();
window.addEventListener('cadence-units', () => { if (latestToday) paintToday(latestToday, true); }); // units arrived after the first paint (no celebrations again)

// Moves what this device still holds (older notes/photos) up to the server, once per day shown.
function syncExtrasOnce(data) {
  if (syncedDays.has(data.date)) return;
  syncedDays.add(data.date);
  const items = data.meals.flatMap((m) => m.items);
  if (!items.length) return;
  syncLocalExtras(items).then((moved) => { if (moved) loadToday(); });
}
let viewDate = new URLSearchParams(window.location.search).get('date'); // null = today

// Coming back from a finished flow: open the day the plate was filed under and say where it went.
let justSaved = false; // arrived here right after saving a meal: time to celebrate what that unlocked

function applyReturnHints() {
  try {
    const day = sessionStorage.getItem('cadence_open_date');
    if (day) {
      sessionStorage.removeItem('cadence_open_date');
      viewDate = day;
      const url = new URL(window.location.href);
      url.searchParams.set('date', day);
      history.replaceState(history.state, '', url);
    }
    const flash = sessionStorage.getItem('cadence_flash');
    if (flash) {
      justSaved = true;
      const kind = sessionStorage.getItem('cadence_flash_kind') || 'ok';
      sessionStorage.removeItem('cadence_flash');
      sessionStorage.removeItem('cadence_flash_kind');
      showToast(flash, kind);
    }
  } catch { /* no storage */ }
}

function isViewingToday() {
  return !latestToday || !latestToday.today || latestToday.date === latestToday.today;
}

function shiftDate(iso, days) {
  const d = new Date(`${iso}T12:00:00`);
  d.setDate(d.getDate() + days);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function goToDate(iso) {
  viewDate = iso && latestToday && iso >= latestToday.today ? null : iso;
  const url = new URL(window.location.href);
  if (viewDate) url.searchParams.set('date', viewDate); else url.searchParams.delete('date');
  history.replaceState(null, '', url);
  loadToday();
}

// Swipe the diary sideways to change day (right = the day before). Rows that already swipe (delete) and the week strip keep their own gesture.
(function () {
  const area = document.querySelector('.app-content');
  let start = null;
  area.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    start = e.touches.length === 1 && !e.target.closest('.swipe-row, .pg-swipe, .db-pager, input, textarea, select') ? { x: t.clientX, y: t.clientY } : null;
  }, { passive: true });
  area.addEventListener('touchend', (e) => {
    if (!start || !latestToday || document.querySelector('.sheet-scrim')) { start = null; return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - start.x;
    const dy = t.clientY - start.y;
    start = null;
    if (Math.abs(dx) < 90 || Math.abs(dx) < 2.2 * Math.abs(dy)) return;
    if (dx < 0 && latestToday.date >= latestToday.today) return; // nothing after today
    if (window.sfx) sfx.play('tick');
    goToDate(shiftDate(latestToday.date, dx > 0 ? -1 : 1));
  }, { passive: true });
})();

// ---- The day bar: what day you are looking at (big), the weeks (a smooth swipeable strip) and the way back to today ----
const DOW_LETTER = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
const STRIP_WEEKS_BACK = 104; // two years of weeks are ready to swipe through
const stripInfo = {}; // iso day -> calendar info ({streak}); kept between days so the marks do not blink
const monthFetched = {}; // 'YYYY-MM' -> when its marks were last read
let stripBuiltFor = null; // 'today' the pager was built for
let stripFirst = null; // Monday (iso) of the first page
let stripCount = 0;
let stripIdx = -1; // page showing now
let stripFor = null; // the day the pager was last pointed at
let stripMonthKey = null; // month of the week on screen (opens the calendar there)
let stripSig = '';
let lastSelected = null;
const cap = (text) => text.charAt(0).toUpperCase() + text.slice(1);
const longDay = (iso, withYear) => new Date(`${iso}T12:00:00`).toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long', ...(withYear ? { year: 'numeric' } : {}) }).replace(',', '');
const monthName = (iso, style) => cap(new Date(`${iso}T12:00:00`).toLocaleDateString('es', { month: style }).replace('.', ''));

function weekStartOf(iso) {
  const lead = (new Date(`${iso}T12:00:00`).getDay() + 6) % 7; // weeks start on Monday
  return shiftDate(iso, -lead);
}
const weekAt = (idx) => shiftDate(stripFirst, idx * 7);
const weekIdx = (iso) => Math.round((new Date(`${weekStartOf(iso)}T12:00:00`) - new Date(`${stripFirst}T12:00:00`)) / (7 * 864e5));

// A day is one of: future | empty (nothing logged) | late (logged, but after its day: no streak) | flame (counts for the streak).
function dayState(iso, today) {
  if (iso > today) return 'future';
  const info = stripInfo[iso];
  return !info ? 'empty' : info.streak > 0 ? 'flame' : 'late';
}

function updateCell(btn, today, selected) {
  const iso = btn.dataset.date;
  const state = dayState(iso, today);
  btn.dataset.state = state;
  btn.disabled = state === 'future';
  btn.classList.toggle('today', iso === today);
  btn.classList.toggle('sel', iso === selected);
  btn.setAttribute('aria-pressed', String(iso === selected));
  const info = stripInfo[iso];
  btn.querySelector('.db-mark').innerHTML = state === 'flame' ? flameSvg(info.streak, 14) : state === 'late' ? '<i class="db-late"></i>' : '';
  // the ring around a day with entries: how much of the goal was eaten (green inside the band, amber above it)
  const num = btn.querySelector('.db-num');
  const goal = (latestToday && latestToday.goal && latestToday.goal.kcal) || 0;
  const kcal = info && info.kcal ? info.kcal : 0;
  const ratio = goal > 0 ? kcal / goal : 0;
  num.style.setProperty('--p', String(Math.min(100, Math.round(ratio * 100))));
  num.style.setProperty('--rc', ratio > 1.15 ? 'var(--ember)' : ratio >= 0.9 ? 'var(--good)' : 'var(--accent-to)');
  btn.setAttribute('aria-label', `${cap(longDay(iso))}${state === 'flame' ? `, racha de ${info.streak} ${info.streak === 1 ? 'día' : 'días'}` : state === 'late' ? ', registrado después, sin racha' : state === 'empty' ? ', sin registro' : ''}${kcal ? `, ${kcal} kcal` : ''}`);
}

function paintStrip(data, wide) {
  const pager = document.getElementById('dbPager');
  const span = wide ? 3 : 1;
  for (let i = Math.max(0, stripIdx - span); i <= Math.min(stripCount - 1, stripIdx + span); i += 1) {
    pager.children[i].querySelectorAll('.db-day').forEach((btn) => updateCell(btn, data.today, data.date));
  }
}

function buildPager(today, selected) {
  const pager = document.getElementById('dbPager');
  stripFirst = shiftDate(weekStartOf(today), -7 * Math.max(STRIP_WEEKS_BACK, Math.ceil((new Date(`${today}T12:00:00`) - new Date(`${selected}T12:00:00`)) / (7 * 864e5)) + 2));
  stripCount = weekIdxOfToday(today) + 1;
  pager.innerHTML = Array.from({ length: stripCount }, (_, w) => `<div class="db-week">${Array.from({ length: 7 }, (_, d) => {
    const iso = shiftDate(weekAt(w), d);
    const first = iso.endsWith('-01');
    return `<button type="button" class="db-day" data-date="${iso}"><span class="db-dow${first ? ' month' : ''}">${first ? monthName(iso, 'short').toUpperCase() : DOW_LETTER[d]}</span><span class="db-num mono">${Number(iso.slice(8))}</span><span class="db-mark"></span></button>`;
  }).join('')}</div>`).join('');
  stripBuiltFor = today;
  stripIdx = -1;
  lastSelected = null;
}
const weekIdxOfToday = (today) => Math.round((new Date(`${weekStartOf(today)}T12:00:00`) - new Date(`${stripFirst}T12:00:00`)) / (7 * 864e5));

function updateStripLabel(today) {
  const mon = weekAt(stripIdx);
  const sun = shiftDate(mon, 6);
  stripMonthKey = shiftDate(mon, 3).slice(0, 7); // the month most of the week belongs to
  const yearOf = (iso) => iso.slice(0, 4);
  const label = mon.slice(0, 7) === sun.slice(0, 7)
    ? `${monthName(mon, 'long')}${yearOf(mon) !== yearOf(today) ? ` ${yearOf(mon)}` : ''}`
    : `${monthName(mon, 'short')} – ${monthName(sun, 'short')}${yearOf(sun) !== yearOf(today) ? ` ${yearOf(sun)}` : ''}`;
  document.getElementById('dbMonth').textContent = label;
  document.getElementById('dbPrevW').disabled = stripIdx <= 0;
  document.getElementById('dbNextW').disabled = stripIdx >= stripCount - 1;
}

async function refreshStrip(data, force) {
  const weeks = [stripIdx - 1, stripIdx, stripIdx + 1].filter((i) => i >= 0 && i < stripCount);
  const months = [...new Set(weeks.flatMap((i) => [weekAt(i), shiftDate(weekAt(i), 6)]).map(monthKey))]
    .filter((m) => force || !monthFetched[m] || Date.now() - monthFetched[m] > 60000);
  if (!months.length) return;
  months.forEach((m) => { monthFetched[m] = Date.now(); });
  const results = await Promise.all(months.map((m) => apiGet(`api/calendar?month=${m}`).catch(() => { delete monthFetched[m]; return null; })));
  if (latestToday !== data) return;
  results.forEach((res, i) => {
    if (!res) return;
    const fresh = new Set((res.days || []).map((d) => d.date));
    (res.days || []).forEach((d) => { stripInfo[d.date] = d; });
    Object.keys(stripInfo).filter((iso) => monthKey(iso) === months[i] && !fresh.has(iso)).forEach((iso) => { delete stripInfo[iso]; });
  });
  paintStrip(data, true);
}

function renderDayBar(data) {
  const isToday = data.date === data.today;
  const yesterday = shiftDate(data.today, -1);
  const year = data.date.slice(0, 4) !== data.today.slice(0, 4);
  document.getElementById('dbLabel').textContent = isToday ? 'Hoy' : data.date === yesterday ? 'Ayer' : cap(longDay(data.date, year));
  document.getElementById('dbDate').textContent = isToday || data.date === yesterday ? `· ${longDay(data.date)}` : '';
  const pager = document.getElementById('dbPager');
  if (stripBuiltFor !== data.today) buildPager(data.today, data.date);
  // Point the strip at the week of the day being shown (smoothly when it is close, at once when it is far).
  if (stripFor !== data.date) {
    const idx = weekIdx(data.date);
    if (idx !== stripIdx) {
      const near = stripIdx >= 0 && Math.abs(idx - stripIdx) <= 4;
      pager.scrollTo({ left: idx * pager.clientWidth, behavior: near ? 'smooth' : 'auto' });
      if (!near) stripIdx = idx;
    }
    stripFor = data.date;
  }
  if (stripIdx < 0) stripIdx = Math.max(0, Math.min(stripCount - 1, Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth))));
  if (lastSelected && lastSelected !== data.date) { const old = pager.querySelector(`.db-day[data-date="${lastSelected}"]`); if (old) { old.classList.remove('sel'); old.setAttribute('aria-pressed', 'false'); } }
  lastSelected = data.date;
  updateStripLabel(data.today);

  const openCal = () => { if (window.sfx) sfx.play('open'); openCalendar(data.date, data.today, stripMonthKey); };
  document.getElementById('dbCal').onclick = openCal;
  const title = document.getElementById('dbTitle');
  title.onclick = openCal;
  title.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCal(); } };
  pager.onclick = (e) => {
    const btn = e.target.closest('.db-day');
    if (!btn || btn.disabled || btn.dataset.date === data.date) return;
    if (window.sfx) sfx.play('tick');
    goToDate(btn.dataset.date);
  };
  document.getElementById('dbPrevW').onclick = () => pager.scrollBy({ left: -pager.clientWidth, behavior: 'smooth' });
  document.getElementById('dbNextW').onclick = () => pager.scrollBy({ left: pager.clientWidth, behavior: 'smooth' });
  let frame = 0;
  let settle = 0;
  pager.onscroll = () => {
    if (!frame) {
      frame = requestAnimationFrame(() => {
        frame = 0;
        const idx = Math.max(0, Math.min(stripCount - 1, Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth))));
        if (idx !== stripIdx) { stripIdx = idx; updateStripLabel(latestToday.today); paintStrip(latestToday, false); }
      });
    }
    clearTimeout(settle);
    settle = setTimeout(() => { if (latestToday) { paintStrip(latestToday, true); refreshStrip(latestToday, false); } }, 140); // once it stops
  };

  const away = document.getElementById('dbAway');
  away.hidden = isToday;
  if (!isToday) {
    const sameMonth = data.date.slice(0, 7) === data.today.slice(0, 7);
    const named = new Date(`${data.date}T12:00:00`).toLocaleDateString('es', { weekday: 'long', day: 'numeric', ...(sameMonth ? {} : { month: 'long' }) });
    document.getElementById('dbAwayText').innerHTML = `Estás viendo <b>el ${escapeHtml(named)}</b>, no hoy`;
    document.getElementById('dbBack').onclick = () => { if (window.sfx) sfx.play('pick'); goToDate(data.today); };
  }
  // Today's own flame comes straight from the diary being shown; the rest from the calendar, read behind it.
  if (isToday && data.totals && data.totals.kcal > 0 && data.streak_days > 0) stripInfo[data.date] = { date: data.date, streak: data.streak_days, kcal: Math.round(data.totals.kcal) };
  else if (stripInfo[data.date] && data.totals) stripInfo[data.date].kcal = Math.round(data.totals.kcal);
  paintStrip(data, true);
  const sig = `${data.date}|${Math.round(data.totals ? data.totals.kcal : 0)}|${data.streak_days}`;
  const changed = sig !== stripSig;
  stripSig = sig;
  refreshStrip(data, changed);
}

// ---- Workouts: search an activity, pick a duration (js/workouts.js). The burn is an estimate and does not change the goal. ----
function renderWorkouts(data) {
  const box = document.getElementById('workoutCard');
  const list = data.workouts || [];
  const burned = list.reduce((sum, w) => sum + w.kcal, 0);
  const label = (w) => (cadenceWorkouts.info(w.kind) ? cadenceWorkouts.info(w.kind).label : w.kind);
  box.innerHTML = `
    ${list.map((w) => `
      <div class="wo-row" data-open="${w.id}" role="button" tabindex="0" aria-label="Editar ${escapeHtml(label(w))}">
        ${cadenceWorkouts.art(cadenceWorkouts.info(w.kind), 38)}
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:700;">${escapeHtml(label(w))} · ${w.minutes} min</div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml([w.at, w.note].filter(Boolean).join(' · ') || 'Quemadas estimadas')}</div>
        </div>
        <span class="mono" style="font-size:12.5px;font-weight:700;color:var(--good);">−${Math.round(w.kcal)}</span>
        <button class="row-del" data-wo="${w.id}" aria-label="Borrar entrenamiento"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-9 0l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>`).join('')}
    <button type="button" class="wo-add" id="woAdd">${list.length ? '+ Otro entrenamiento' : '<i data-ico="barbell"></i> Registrar entrenamiento'}</button>
    ${list.length ? `<div class="wo-note">Estimado por actividad y peso (${Math.round(burned)} kcal en total). No cambia tu meta del día.</div>` : ''}`;
  document.getElementById('woAdd').addEventListener('click', () => cadenceWorkouts.openSearch(data.date, loadToday));
  box.querySelectorAll('[data-open]').forEach((row) => {
    const open = () => { const w = list.find((x) => String(x.id) === row.dataset.open); if (w) cadenceWorkouts.openEdit(w, loadToday); };
    row.addEventListener('click', (e) => { if (!e.target.closest('[data-wo]')) open(); });
    row.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
  });
  box.querySelectorAll('[data-wo]').forEach((b) => b.addEventListener('click', async () => {
    try { await apiDelete(`api/workouts/${b.dataset.wo}`); if (window.sfx) sfx.play('remove'); loadToday(); } catch (err) { showToast(err.message); }
  }));
}

// ---- Central button: the cadence mark opens Foto · Código · Voz (it never opens the camera by itself) ----
const launcher = document.getElementById('launcher');
const lcScrim = document.getElementById('lcScrim');
const fabBtn = document.getElementById('fabBtn');

function setLauncher(open) {
  launcher.classList.toggle('open', open);
  lcScrim.classList.toggle('open', open);
  fabBtn.setAttribute('aria-expanded', String(open));
  launcher.querySelectorAll('.lc-sat').forEach((a) => a.setAttribute('tabindex', open ? '0' : '-1'));
}
const LC_MEALS = { desayuno: 'Desayuno', almuerzo: 'Almuerzo', merienda: 'Merienda', cena: 'Cena' };
// Which meal the three options register into (null = the one the photo's time suggests).
function setLauncherMeal(meal) {
  const q = meal ? `meal=${encodeURIComponent(meal)}` : '';
  launcher.querySelector('.lc-foto').setAttribute('href', `scan.html${q ? `?${q}` : ''}`);
  launcher.querySelector('.lc-code').setAttribute('href', `scan.html?mode=barcode${q ? `&${q}` : ''}`);
  launcher.querySelector('.lc-voz').setAttribute('href', `voice.html${q ? `?${q}` : ''}`);
  const chip = document.getElementById('lcMeal');
  chip.textContent = meal && LC_MEALS[meal] ? `AGREGAR ${LC_MEALS[meal].toUpperCase()}` : '';
  chip.classList.toggle('has', !!(meal && LC_MEALS[meal]));
}
// From "Agregar almuerzo" and similar: phones open the central menu; computers open the register panel.
function openRegister(meal) {
  if (window.matchMedia('(min-width: 1024px)').matches) { window.openRegisterMenu({ meal }); return; }
  openLauncher(meal);
}
function openLauncher(meal) {
  setLauncherMeal(meal || null);
  if (launcher.classList.contains('open')) return;
  setLauncher(true);
  window.sfx && sfx.play('open');
  pushOverlay(() => setLauncher(false)); // the system Back button closes it and stays on the diary
}
function closeLauncher(quiet) {
  if (!launcher.classList.contains('open')) return;
  if (!quiet && window.sfx) sfx.play('close');
  dismissOverlay();
}
fabBtn.addEventListener('click', () => (launcher.classList.contains('open') ? closeLauncher() : openLauncher()));
document.getElementById('deskRegister').addEventListener('click', () => window.openRegisterMenu());
document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('[data-register]'); if (b) openRegister(null); });
lcScrim.addEventListener('click', () => closeLauncher());
launcher.querySelectorAll('[data-launch]').forEach((a) => a.addEventListener('click', (e) => {
  if (e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  const href = a.getAttribute('href');
  window.sfx && sfx.play('tick');
  dismissOverlay(() => { window.location.href = href; }); // close first, so Back from the camera lands on a clean diary
}));

// The rewards: reaching the day's goal, and a streak that grew. Only right after saving a meal.
const MILESTONES = [3, 7, 14, 30, 50, 100, 365];
function celebrate(data) {
  if (!justSaved || data.today !== data.date) return;
  justSaved = false;
  const lines = [];
  if (sessionStorage.getItem('cadence_water_goal')) { sessionStorage.removeItem('cadence_water_goal'); lines.push(['goal', {}, '¡Meta de agua cumplida!']); }
  const ratio = data.goal.kcal > 0 ? data.totals.kcal / data.goal.kcal : 0;
  try {
    if (ratio >= 0.9 && ratio <= 1.1 && localStorage.getItem('cadence_goal_day') !== data.date) {
      localStorage.setItem('cadence_goal_day', data.date);
      lines.push(['goal', {}, '¡Cumpliste tu meta de hoy!']);
    }
    const seen = Number(localStorage.getItem('cadence_streak_seen') || 0);
    if (data.streak_days > seen && data.streak_days > 0) {
      lines.push(['streak', { days: data.streak_days, milestone: MILESTONES.includes(data.streak_days) }, `¡Racha de ${data.streak_days} ${data.streak_days === 1 ? 'día' : 'días'}!`]);
    }
  } catch { /* no storage: skip the party */ }
  lines.forEach(([sound, opts, text], i) => setTimeout(() => { if (window.sfx) sfx.play(sound, opts); showToast(text, 'ok'); }, 650 + i * 1100));
}

// Awards earned by what was just logged (only today's): a chime and a line, a little after the other celebrations.
function celebrateAwards(data) {
  const fresh = data.awards_new || [];
  if (!fresh.length || data.today !== data.date) return;
  setTimeout(() => {
    if (window.sfx) sfx.play('award');
    showToast(fresh.length === 1 ? `¡Premio nuevo: ${fresh[0].title}!` : `¡${fresh.length} premios nuevos!`, 'ok');
  }, 1900);
}

// A dot on the Retos tab when there are coins to collect.
function renderIdeasLink(data) {
  const link = document.getElementById('ideasLink');
  const left = Math.round(data.goal.kcal - data.totals.kcal);
  link.style.display = data.date === data.today && left > 150 ? '' : 'none';
  document.getElementById('ideasSub').textContent = `Te faltan ${left} kcal · ${Math.max(0, Math.round(data.goal.protein_g - data.totals.protein_g))} g de proteína`;
}

function paintRetosDot(d) { const dot = document.getElementById('retosDot'); if (dot) dot.hidden = !d.claimable; }

function noteStreak(data) {
  if (data.today !== data.date) return;
  try { localStorage.setItem('cadence_streak_seen', String(data.streak_days)); } catch { /* no storage */ }
}

function paintToday(data, stale) {
  latestToday = data;
  if (!stale) hideBanner('wger');
  renderDayBar(data);

  document.getElementById('greeting').textContent = data.user_name ? `Hola, ${data.user_name}` : 'Hola';
  document.getElementById('streakValue').textContent = data.streak_days;
  document.getElementById('todayKcalLabel').textContent = `${Math.round(data.totals.kcal)} KCAL`;
  renderRing(data);
  renderPace(data);
  loadCalibrationHint(data);
  renderMacroBars(data.totals, data.goal);
  renderInsight(data);
  renderMeals(data.meals);
  renderWater(data);
  renderScoreCards(data);
  renderIdeasLink(data);
  renderWorkouts(data);
  cadenceWorkouts.load().then(() => { if (latestToday === data) renderWorkouts(data); }).catch(() => {}); // activity names and icons

  if (!stale) { celebrate(data); noteStreak(data); syncExtrasOnce(data); celebrateAwards(data); }
  document.getElementById('waterGoalBtn').onclick = () => openWaterGoal(data);
  const setMode = (mode) => { kcalMode = mode; try { localStorage.setItem('cadence_kcal_mode', mode); } catch { /* no storage */ } if (window.sfx) sfx.play('tick'); renderRing(data); renderInsight(data); };
  document.getElementById('modeLeft').onclick = () => setMode('left');
  document.getElementById('modeBurn').onclick = () => setMode('burn');
}

async function loadToday() {
  Object.keys(calCache).forEach((k) => delete calCache[k]);
  try {
    await flushPending().catch(() => {});
    await flushWater().catch(() => {});
    await importLocalWater().catch(() => {});
    // The last diary this device saw shows at once; the fresh one replaces it a moment later.
    await apiGetSWR(viewDate ? `api/today?date=${encodeURIComponent(viewDate)}` : 'api/today', paintToday);
    apiGetSWR('api/challenges', paintRetosDot).catch(() => {}); // the dot on the Retos tab
  } catch (err) {
    if (!navigator.onLine) return; // the offline banner already explains it
    showBanner('wger', `No pudimos cargar tu diario: ${err.message}`, 'Reintentar', loadToday);
  }
}

(async function start() {
  // Signed in and set up, or on the way to the screen that fixes that. Checked alongside the diary
  // (not before it): the diary call answers 401 by itself if the session is gone.
  applyReturnHints();
  loadToday();
  try { await ensureSession(); } catch { /* redirected */ }
})();
// Back from a flow can restore this page from the browser's memory: refresh what it shows.
window.addEventListener('pageshow', (e) => { if (e.persisted) { applyReturnHints(); loadToday(); } });

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
