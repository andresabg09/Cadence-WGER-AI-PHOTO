<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cadence</title>
<meta name="theme-color" content="#0A0A0F">
<link rel="manifest" href="static/manifest.json">
<link rel="icon" href="static/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="static/css/pulse.css">
<script>
  (function () {
    var t = localStorage.getItem('cadence_theme') || 'dark';
    if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body class="with-shell" data-page="diario">
<div class="app">
  <div class="app-header">
    <div>
      <div class="date" id="todayLabel">&nbsp;</div>
      <h1 class="disp" id="greeting">Hola</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <a href="scan.html" class="btn-upload desktop-only">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4M5 20h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Subir foto
      </a>
      <div class="streak-pill">
        <span class="flame">🔥</span>
        <span class="mono" id="streakValue" style="font-weight:700;color:var(--ember);font-size:13px;">–</span>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="Apariencia">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"></svg>
      </button>
      <button class="icon-btn" id="profileBtn" aria-label="Perfil">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="var(--ink-soft)" stroke-width="1.8"/><path d="M5 20c1.4-3.8 4.2-5.6 7-5.6s5.6 1.8 7 5.6" stroke="var(--ink-soft)" stroke-width="1.8"/></svg>
      </button>
    </div>
  </div>

  <div class="app-content grid-2">
    <div class="col">
    <!-- Hero: ring + macros -->
    <div class="hero-card">
      <div class="blob-wrap"><div class="blob"></div></div>
      <div style="display:flex;align-items:center;gap:16px;position:relative;">
        <div style="position:relative;width:112px;height:112px;flex-shrink:0;">
          <svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--accent-from)"/>
                <stop offset="100%" stop-color="var(--accent-to)"/>
              </linearGradient>
            </defs>
            <circle cx="56" cy="56" r="47" fill="none" stroke="rgba(127,127,140,0.16)" stroke-width="10"/>
            <circle id="ringArc" cx="56" cy="56" r="47" fill="none" stroke="url(#ringGrad)" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="0 296" transform="rotate(-90 56 56)"/>
          </svg>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <span class="mono value-live" id="kcalLeft" style="font-size:23px;font-weight:700;line-height:1;">–</span>
            <span style="font-size:9.5px;color:var(--ink-soft);font-weight:600;letter-spacing:0.05em;">KCAL LIBRES</span>
          </div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:10px;" id="macroBars"></div>
      </div>
      <div class="insight-chip" id="insightChip" style="display:none;">
        <span>✨</span>
        <span><strong>Insight:</strong> <span id="insightText"></span></span>
      </div>
    </div>

    <!-- Water -->
    <div class="card" style="display:flex;align-items:center;gap:14px;">
      <div class="bottle-wrap">
        <div class="bottle-cap"></div>
        <div class="bottle-body"><div class="bottle-fill" id="bottleFill" style="height:0%;"></div></div>
      </div>
      <div style="flex:1;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;">
          <span style="font-size:13px;font-weight:700;">Agua</span>
          <span class="mono" style="font-size:12px;font-weight:700;color:var(--accent-to);">
            <span id="waterMl">0</span><span style="color:var(--ink-soft);font-weight:600;font-size:10.5px;"> / 2000 ML</span>
          </span>
        </div>
        <div style="display:flex;gap:5px;" id="waterTicks"></div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="step-btn remove" id="waterMinus" aria-label="Quitar vaso de agua">−</button>
        <button class="step-btn add" id="waterPlus" aria-label="Agregar vaso de agua">+</button>
      </div>
    </div>

    </div>

    <div class="col">
    <!-- Meals -->
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0 2px;">
        <h2 class="disp" style="margin:0;font-size:15px;font-weight:700;">Hoy</h2>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="mono" id="todayKcalLabel" style="font-size:10.5px;color:var(--ink-soft);">0 KCAL</span>
          <a href="search.html" aria-label="Buscar alimento manualmente" style="width:26px;height:26px;border-radius:9px;background:var(--card);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="var(--ink-soft)" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="var(--ink-soft)" stroke-width="2" stroke-linecap="round"/></svg>
          </a>
        </div>
      </div>
      <div id="mealsList"></div>
    </div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab active" aria-current="page">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="5" stroke="var(--accent-to)" stroke-width="1.8"/><path d="M8 10h8M8 14h5" stroke="var(--accent-to)" stroke-width="1.8"/></svg>
      <span>Diario</span>
    </button>
    <a href="scan.html" class="fab" aria-label="Escanear comida con IA — acción principal">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 012-2h1.2l.9-1.5A2 2 0 0110 3.5h4a2 2 0 011.9 1l.9 1.5H18a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V8z" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="13" r="3.4" stroke="#fff" stroke-width="1.8"/><path d="M12 10.2v5.6M9.2 13h5.6" stroke="#fff" stroke-width="1.3"/></svg>
    </a>
    <button class="tab" id="progressBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 19V9M12 19V5M19 19v-7" stroke="var(--ink-soft)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Progreso</span>
    </button>
  </div>
</div>

<script src="static/js/api.js"></script>
<script src="static/js/theme.js"></script>
<script src="static/js/shell.js"></script>
<script src="static/js/install.js"></script>
<script>
const WATER_GOAL_ML = 2000;
const WATER_STEP_ML = 250;
const MEAL_ICON_BG = {
  desayuno: 'linear-gradient(140deg, #3a2e22, #241c14)',
  almuerzo: 'linear-gradient(140deg, #c97b4a, #8a4e26)',
  merienda: 'linear-gradient(140deg, #6fa34a, #4c7a30)',
  cena: 'linear-gradient(140deg, #4a3826, #2e2015)',
  otro: 'linear-gradient(140deg, #555, #333)',
};
const ALWAYS_SHOWN = ['desayuno', 'almuerzo', 'cena'];
const ADD_MORE_LABEL = { desayuno: 'al desayuno', almuerzo: 'al almuerzo', merienda: 'a la merienda', cena: 'a la cena' };

document.getElementById('profileBtn').addEventListener('click', () => showToast('Perfil: próximamente', 'warn'));
document.getElementById('progressBtn').addEventListener('click', () => showToast('Progreso: próximamente', 'warn'));

function waterStorageKey(dateIso) {
  return `cadence_water_${dateIso}`;
}

function getWaterMl(dateIso) {
  return Number(localStorage.getItem(waterStorageKey(dateIso)) || 0);
}

function setWaterMl(dateIso, ml) {
  const clamped = Math.max(0, ml);
  localStorage.setItem(waterStorageKey(dateIso), String(clamped));
  renderWater(clamped);
}

function renderWater(ml) {
  document.getElementById('waterMl').textContent = ml;
  document.getElementById('bottleFill').style.height = `${Math.min(100, (ml / WATER_GOAL_ML) * 100)}%`;
  const filledTicks = Math.round((ml / WATER_GOAL_ML) * 4);
  const ticksWrap = document.getElementById('waterTicks');
  ticksWrap.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const tick = document.createElement('div');
    tick.style.cssText = `flex:1;height:5px;border-radius:100px;background:${i < filledTicks ? 'var(--accent-to)' : 'rgba(127,127,140,0.18)'};`;
    ticksWrap.appendChild(tick);
  }
}

function renderMacroBars(totals, goal) {
  const rows = [
    { label: 'PROTEÍNA', value: totals.protein_g, goal: goal.protein_g },
    { label: 'CARBOS', value: totals.carbs_g, goal: goal.carbs_g },
    { label: 'GRASA', value: totals.fat_g, goal: goal.fat_g },
  ];
  const wrap = document.getElementById('macroBars');
  wrap.innerHTML = '';
  rows.forEach((row) => {
    const pct = row.goal > 0 ? Math.min(100, (row.value / row.goal) * 100) : 0;
    const div = document.createElement('div');
    div.innerHTML = `
      <div class="macro-row">${row.label}</div>
      <div class="macro-track"><div class="macro-fill" style="width:${pct}%;"></div></div>
    `;
    wrap.appendChild(div);
  });
}

function renderRing(totals, goal) {
  const circumference = 2 * Math.PI * 47; // ~295.3
  const remaining = Math.max(0, goal.kcal - totals.kcal);
  const consumedRatio = goal.kcal > 0 ? Math.min(1, totals.kcal / goal.kcal) : 0;
  const dash = Math.max(4, consumedRatio * circumference); // keep a visible sliver even near 0
  document.getElementById('ringArc').setAttribute('stroke-dasharray', `${dash.toFixed(1)} ${circumference.toFixed(1)}`);
  document.getElementById('kcalLeft').textContent = Math.round(remaining);
}

function renderInsight(totals, goal) {
  const chip = document.getElementById('insightChip');
  const proteinRatio = goal.protein_g > 0 ? totals.protein_g / goal.protein_g : 1;
  if (proteinRatio < 0.6) {
    const pct = Math.round(proteinRatio * 100);
    document.getElementById('insightText').textContent =
      `te falta proteína para tu meta (vas en ${pct}%) — un snack con huevo o pollo te acercaría.`;
    chip.style.display = 'flex';
  } else {
    chip.style.display = 'none';
  }
}

function mealItemRow(item, mealKey) {
  return `
    <div class="swipe-row" data-entry-id="${item.diary_entry_id}">
      <button class="swipe-del" aria-label="Borrar ${escapeHtml(item.name)}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-9 0l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="swipe-content meal-item-row" style="padding:2px 0;">
        <div style="width:44px;height:44px;border-radius:14px;background:${MEAL_ICON_BG[mealKey] || MEAL_ICON_BG.otro};flex-shrink:0;position:relative;">
          <span style="position:absolute;bottom:-4px;right:-4px;background:var(--good);border-radius:100px;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:9px;border:2px solid var(--card);">✓</span>
        </div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;">${escapeHtml(item.name)}</div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${Math.round(item.amount_grams)} g · ${Math.round(item.kcal)} kcal</div>
        </div>
        <button class="row-del" aria-label="Borrar ${escapeHtml(item.name)}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2m-9 0l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  `;
}

function mealCard(meal, key) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.display = 'flex';
  card.style.flexDirection = 'column';
  card.style.gap = '10px';
  const addLabel = ADD_MORE_LABEL[key];
  card.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;">
      <span style="font-size:11px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:0.03em;">${escapeHtml(meal.label)}</span>
      <span style="font-size:11px;color:var(--ink-soft);font-weight:600;">${Math.round(meal.totals.kcal)} kcal</span>
    </div>
    ${meal.items.map((item) => mealItemRow(item, key)).join('')}
    ${addLabel ? `
    <a href="search.html?meal=${key}" style="display:flex;align-items:center;gap:8px;padding:2px 0 0;color:var(--ink-soft);min-height:44px;">
      <span style="width:22px;height:22px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--accent-to);">+</span>
      <span style="font-size:12px;font-weight:600;">Agregar otro alimento ${addLabel}</span>
    </a>` : ''}
  `;
  return card;
}

function dashedAdd(label) {
  const link = document.createElement('a');
  link.href = `scan.html?meal=${label}`;
  link.className = 'dashed-add';
  link.innerHTML = `
    <span style="width:28px;height:28px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-to);">+</span>
    <span style="font-size:13px;font-weight:600;">Agregar ${label}</span>
  `;
  return link;
}

function renderMeals(meals) {
  const list = document.getElementById('mealsList');
  list.innerHTML = '';
  const byKey = Object.fromEntries(meals.map((m) => [m.key, m]));

  const container = document.createElement('div');
  container.style.cssText = 'display:flex;flex-direction:column;gap:10px;';

  if (meals.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <span style="font-size:36px;">🍽️</span>
        <h3 class="disp" style="margin:14px 0 6px;font-size:15.5px;font-weight:700;">Aún no registras nada hoy</h3>
        <p style="margin:0 0 18px;font-size:12px;color:var(--ink-soft);line-height:1.5;">Toma una foto de tu primer plato del día y empieza tu racha.</p>
        <a href="scan.html" class="btn-primary" style="display:inline-flex;width:auto;padding:13px 22px;">✨ Escanear mi primer plato</a>
      </div>`;
    list.appendChild(container);
    return;
  }

  // Desayuno / almuerzo / cena always show (card or dashed "agregar", per the
  // mockup); merienda and otro only appear once something is logged in them.
  ['desayuno', 'almuerzo', 'merienda', 'cena', 'otro'].forEach((key) => {
    const meal = byKey[key];
    if (meal) container.appendChild(mealCard(meal, key));
    else if (ALWAYS_SHOWN.includes(key)) container.appendChild(dashedAdd(key));
  });

  list.appendChild(container);
  wireSwipeToDelete();
}

function wireSwipeToDelete() {
  document.querySelectorAll('.swipe-row').forEach((row) => {
    const content = row.querySelector('.swipe-content');
    const delBtn = row.querySelector('.swipe-del');
    let startX = null;

    content.addEventListener('pointerdown', (e) => { startX = e.clientX; });
    content.addEventListener('pointermove', (e) => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      if (dx < -20) content.classList.add('open');
      if (dx > 20) content.classList.remove('open');
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => {
      content.addEventListener(type, () => { startX = null; });
    });

    const remove = async () => {
      const entryId = row.dataset.entryId;
      try {
        await apiDelete(`api/diary/${entryId}`);
        row.remove();
        loadToday();
      } catch (err) {
        showToast(`No se pudo borrar: ${err.message}`);
      }
    };
    delBtn.addEventListener('click', remove);
    const rowDel = row.querySelector('.row-del');
    if (rowDel) rowDel.addEventListener('click', remove);
  });
}

let latestToday = null;

async function loadToday() {
  const dateLabel = document.getElementById('todayLabel');

  try {
    await flushPending().catch(() => {});
    const data = await apiGet('api/today');
    latestToday = data;
    hideBanner('wger');

    // Label from the server's "today" (user's timezone), not the device clock.
    dateLabel.textContent = new Date(`${data.date}T12:00:00`)
      .toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'short' })
      .replace(/\./g, '').replace(',', '').toUpperCase();
    document.getElementById('greeting').textContent = data.user_name ? `Hola, ${data.user_name}` : 'Hola';
    document.getElementById('streakValue').textContent = data.streak_days;
    document.getElementById('todayKcalLabel').textContent = `${Math.round(data.totals.kcal)} KCAL`;
    renderRing(data.totals, data.goal);
    renderMacroBars(data.totals, data.goal);
    renderInsight(data.totals, data.goal);
    renderMeals(data.meals);
    renderWater(getWaterMl(data.date));

    document.getElementById('waterPlus').onclick = () => setWaterMl(data.date, getWaterMl(data.date) + WATER_STEP_ML);
    document.getElementById('waterMinus').onclick = () => setWaterMl(data.date, getWaterMl(data.date) - WATER_STEP_ML);
  } catch (err) {
    if (!navigator.onLine) return; // the offline banner already explains it
    showBanner('wger', `No pudimos cargar tu diario: ${err.message}`, 'Reintentar', loadToday);
  }
}

loadToday();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
