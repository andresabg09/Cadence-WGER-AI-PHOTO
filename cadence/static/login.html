<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="cadence">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>cadence · Entrar</title>
<meta name="theme-color" content="#0A0A0F">
<link rel="manifest" href="static/manifest.json">
<link rel="icon" href="static/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="static/css/pulse.css">
<script>
  (function () {
    var t = localStorage.getItem('cadence_theme') || 'dark';
    if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<div class="plain-page">
  <div class="plain-body">
    <div style="padding:40px 0 22px;text-align:center;">
      <div id="heroSlot"></div>
      <h1 class="disp" style="margin:18px 0 6px;font-size:26px;font-weight:700;">cadence</h1>
      <p id="tagline" style="margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.5;">Toma una foto de tu plato y conoce tus calorías al instante.</p>
    </div>

    <div class="meal-pick" id="tabs" role="group" aria-label="Acceso" style="margin-bottom:20px;">
      <button type="button" id="tabLogin" aria-pressed="true">Entrar</button>
      <button type="button" id="tabRegister" aria-pressed="false">Crear cuenta</button>
    </div>

    <form id="form" novalidate>
      <div class="form-error" id="error" role="alert"></div>
      <div id="firstNote" style="display:none;margin-bottom:14px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:12px 14px;">
        Eres la primera persona en usar esta instalación: tu cuenta será la <strong style="color:var(--ink);">administradora</strong> y podrás invitar a otras personas.
      </div>
      <label class="field" id="nameField" style="display:none;"><span>NOMBRE</span><input class="input" id="name" autocomplete="name" maxlength="40" placeholder="¿Cómo te llamamos?"></label>
      <label class="field"><span>CORREO</span><input class="input" id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" placeholder="tu@correo.com"></label>
      <label class="field"><span id="passLabel">CONTRASEÑA</span><input class="input" id="password" type="password" autocomplete="current-password" placeholder="Mínimo 8 caracteres"></label>
      <label class="field" id="inviteField" style="display:none;"><span id="codeLabel">CÓDIGO DE INVITACIÓN</span><input class="input code-pill" id="invite" autocomplete="off" autocapitalize="characters" placeholder="ABCD-EFGH"></label>
      <button class="btn-primary" id="submit" type="submit" style="margin-top:6px;">Entrar</button>
    </form>
    <p style="margin:14px 0 0;text-align:center;"><button type="button" class="link-btn" id="resetLink" style="font-size:12.5px;">¿Olvidaste tu contraseña? Tengo un código</button></p>
    <p id="footnote" style="margin:22px 0 0;text-align:center;font-size:11.5px;color:var(--ink-soft);line-height:1.5;"></p>
  </div>
</div>

<script src="static/js/api.js"></script>
<script src="static/js/constellation.js"></script>
<script src="static/js/theme.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const $ = (id) => document.getElementById(id);
let mode = 'login';
let status = { first_user: false, invite_required: true };

// Only ever go to one of our own pages after signing in.
function safeNext() {
  const next = params.get('next') || '';
  return /^[a-z]+\.html(\?[\w=&.-]*)?$/.test(next) ? next : 'index.html';
}

function setMode(next) {
  mode = next;
  const register = mode === 'register';
  const reset = mode === 'reset';
  $('tabs').style.display = reset ? 'none' : '';
  $('resetLink').textContent = reset ? 'Volver a entrar' : '¿Olvidaste tu contraseña? Tengo un código';
  $('resetLink').style.display = status.first_user ? 'none' : '';
  $('codeLabel').textContent = reset ? 'CÓDIGO DE RESTABLECIMIENTO' : 'CÓDIGO DE INVITACIÓN';
  $('passLabel').textContent = reset ? 'NUEVA CONTRASEÑA' : 'CONTRASEÑA';
  $('tabLogin').setAttribute('aria-pressed', String(!register));
  $('tabRegister').setAttribute('aria-pressed', String(register));
  $('nameField').style.display = register ? 'block' : 'none';
  $('inviteField').style.display = reset || (register && status.invite_required && !status.first_user) ? 'block' : 'none';
  $('firstNote').style.display = register && status.first_user ? 'block' : 'none';
  $('password').autocomplete = register || reset ? 'new-password' : 'current-password';
  $('submit').textContent = reset ? 'Guardar nueva contraseña' : register ? 'Crear mi cuenta' : 'Entrar';
  $('error').classList.remove('show');
  $('footnote').textContent = reset
    ? 'El administrador te da el código. Sirve una sola vez y vence en 24 horas.'
    : register
    ? 'Al crear tu cuenta aceptas que tus registros y fotos se guarden para que puedas verlos otra vez.'
    : '';
}

function showError(message) {
  $('error').textContent = message;
  $('error').classList.add('show');
}

async function init() {
  try {
    status = await apiGet('api/auth/status');
  } catch { /* the form still works; the server answers on submit */ }
  // Already signed in: skip the form.
  try {
    const me = await apiGet('api/auth/me');
    rememberUser(me);
    window.location.replace(me.onboarded ? safeNext() : 'onboarding.html');
    return;
  } catch { /* not signed in: show the form */ }
  if (status.first_user) $('tabLogin').style.display = 'none';
  if (params.get('invite')) $('invite').value = params.get('invite');
  if (params.get('reset')) {
    $('invite').value = params.get('reset');
    if (params.get('email')) $('email').value = params.get('email');
    setMode('reset');
    return;
  }
  setMode(status.first_user || params.get('invite') ? 'register' : 'login');
}

$('resetLink').addEventListener('click', () => setMode(mode === 'reset' ? 'login' : 'reset'));
$('tabLogin').addEventListener('click', () => setMode('login'));
$('tabRegister').addEventListener('click', () => setMode('register'));

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) { showError(mode === 'reset' ? 'Escribe tu correo, el código y tu nueva contraseña.' : 'Escribe tu correo y tu contraseña.'); return; }
  if (mode === 'reset' && (!$('invite').value.trim() || password.length < 8)) { showError('Escribe el código y una contraseña de al menos 8 caracteres.'); return; }
  if (mode === 'register') {
    if (!$('name').value.trim()) { showError('Escribe tu nombre.'); return; }
    if (password.length < 8) { showError('La contraseña necesita al menos 8 caracteres.'); return; }
  }
  const button = $('submit');
  button.disabled = true;
  $('error').classList.remove('show');
  try {
    const me = mode === 'reset'
      ? await apiPost('api/auth/reset', { email, code: $('invite').value.trim(), password })
      : mode === 'register'
      ? await apiPost('api/auth/register', { email, password, name: $('name').value.trim(), invite: $('invite').value.trim() || null })
      : await apiPost('api/auth/login', { email, password });
    rememberUser(me);
    window.location.replace(me.onboarded ? safeNext() : 'onboarding.html');
  } catch (err) {
    showError(err.message || 'No se pudo entrar. Inténtalo de nuevo.');
    button.disabled = false;
  }
});

document.getElementById('heroSlot').innerHTML = cadenceHero(150);
mountConstellation(document.body);
init();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
