<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cadence · Perfil</title>
<meta name="theme-color" content="#0A0A0F">
<link rel="manifest" href="static/manifest.json">
<link rel="icon" href="static/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="static/css/pulse.css">
<script>
  (function () {
    var t = localStorage.getItem('cadence_theme') || 'dark';
    if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body class="with-shell" data-page="perfil">
<div class="app">
  <div class="page-head" style="padding:22px 20px 14px;display:flex;align-items:center;gap:12px;">
    <a href="index.html" id="backLink" aria-label="Volver" class="icon-btn" style="width:36px;height:36px;border-radius:11px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
    <h1 class="disp" style="margin:0;font-size:17px;font-weight:700;flex:1;">Perfil</h1>
    <a href="settings.html" aria-label="Ajustes" class="icon-btn" style="width:36px;height:36px;border-radius:11px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="7" r="2" stroke="var(--ink)" stroke-width="1.8"/><circle cx="9" cy="17" r="2" stroke="var(--ink)" stroke-width="1.8"/></svg>
    </a>
  </div>

  <div class="app-content" id="content" style="display:flex;flex-direction:column;gap:16px;padding-bottom:60px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px;">
      <div id="avatar" style="width:76px;height:76px;border-radius:26px;background:linear-gradient(135deg,var(--accent-from),var(--accent-to));display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px -6px rgba(124,92,255,0.5);">
        <span class="disp" id="initial" style="font-size:28px;font-weight:700;color:#fff;">·</span>
      </div>
      <div style="text-align:center;">
        <div class="disp" id="userName" style="font-size:17px;font-weight:700;">&nbsp;</div>
        <div id="userEmail" style="font-size:12px;color:var(--ink-soft);margin-top:2px;">&nbsp;</div>
      </div>
      <button class="link-btn" id="editName">Editar nombre</button>
    </div>

    <div class="stat-row">
      <div class="stat"><b id="statStreak" style="color:#FF8A5B;">–</b><span>RACHA</span></div>
      <div class="stat"><b id="statWeight">–</b><span>PESO KG</span></div>
      <div class="stat"><b id="statKcal" style="color:var(--accent-to);">–</b><span>META KCAL</span></div>
    </div>

    <div>
      <div class="section-title">TU PLAN</div>
      <div class="menu-card">
        <a class="menu-row" href="goals.html"><span class="ico">🎯</span><span class="label">Objetivos</span><span class="hint" id="goalHint"></span><span class="chev">›</span></a>
        <button class="menu-row" id="weightRow"><span class="ico" style="background:rgba(45,212,255,0.12);">⚖️</span><span class="label">Registrar mi peso</span><span class="hint" id="weightHint"></span><span class="chev">›</span></button>
      </div>
    </div>

    <div>
      <div class="section-title">TU ACTIVIDAD</div>
      <div class="menu-card">
        <a class="menu-row" href="progress.html"><span class="ico" style="background:rgba(61,220,132,0.12);">📈</span><span class="label">Progreso y logros</span><span class="chev">›</span></a>
        <a class="menu-row" href="history.html"><span class="ico">📜</span><span class="label">Historial completo</span><span class="chev">›</span></a>
      </div>
    </div>
  </div>
</div>

<script src="static/js/api.js"></script>
<script src="static/js/sfx.js"></script>
<script src="static/js/theme.js"></script>
<script src="static/js/shell.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const GOAL_LABEL = { lose: 'Bajar de peso', maintain: 'Mantener', gain: 'Subir de peso', muscle: 'Ganar músculo' };
let me = null;

// Back arrow: where you came from (the system Back button does the same).
$('backLink').addEventListener('click', (e) => {
  if (history.length > 1 && document.referrer.startsWith(window.location.origin)) { e.preventDefault(); history.back(); }
});

function openSheet(html, bind) {
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim';
  const sheet = document.createElement('div');
  sheet.className = 'entry-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.innerHTML = html;
  document.body.append(scrim, sheet);
  pushOverlay(() => { scrim.remove(); sheet.remove(); });
  scrim.addEventListener('click', () => dismissOverlay());
  bind(sheet, (after) => dismissOverlay(after));
}

function render() {
  const p = me.profile;
  $('initial').textContent = (me.name || '?').trim().charAt(0).toUpperCase();
  $('userName').textContent = me.name;
  $('userEmail').textContent = me.email;
  $('statWeight').textContent = p.weight_kg != null ? Number(p.weight_kg).toFixed(1) : '–';
  $('statKcal').textContent = me.targets ? me.targets.kcal : '–';
  $('goalHint').textContent = p.goal ? GOAL_LABEL[p.goal].toUpperCase() : '';
  $('weightHint').textContent = p.target_weight_kg ? `META ${p.target_weight_kg} KG` : '';
}

async function loadStreak() {
  try {
    const s = await apiGet('api/streaks');
    $('statStreak').textContent = s.current ? s.current.length : 0;
  } catch { /* the number just stays empty */ }
}

// ---- name ----
$('editName').addEventListener('click', () => openSheet(`
  <h3 class="disp" style="margin:0 0 12px;font-size:17px;">Tu nombre</h3>
  <input class="input" id="nameInput" maxlength="40" value="${escapeHtml(me.name)}" autocomplete="name">
  <div class="form-error" id="sErr" style="margin-top:10px;"></div>
  <div class="sheet-actions"><button class="btn-primary" id="sSave">Guardar</button></div>`, (sheet, close) => {
  sheet.querySelector('#sSave').addEventListener('click', async () => {
    try {
      me = await apiPut('api/name', { name: sheet.querySelector('#nameInput').value });
      close(render);
    } catch (err) { const e = sheet.querySelector('#sErr'); e.textContent = err.message; e.classList.add('show'); }
  });
}));

// ---- weight ----
$('weightRow').addEventListener('click', () => openSheet(`
  <h3 class="disp" style="margin:0 0 4px;font-size:17px;">Registrar mi peso</h3>
  <p style="margin:0 0 14px;font-size:12px;color:var(--ink-soft);">Se guarda con la fecha de hoy.</p>
  <div class="input-unit"><input class="input" id="kg" type="number" inputmode="decimal" min="30" max="300" step="0.1" value="${me.profile.weight_kg || ''}" placeholder="70.0"><i>kg</i></div>
  <div class="form-error" id="sErr" style="margin-top:10px;"></div>
  <div class="sheet-actions"><button class="btn-primary" id="sSave">Guardar peso</button></div>`, (sheet, close) => {
  sheet.querySelector('#sSave').addEventListener('click', async () => {
    try {
      me = await apiPost('api/weight', { kg: Number(sheet.querySelector('#kg').value) });
      if (window.sfx) sfx.play('save');
      close(render);
    } catch (err) { const e = sheet.querySelector('#sErr'); e.textContent = err.message; e.classList.add('show'); }
  });
}));

(async function init() {
  try { me = await ensureSession(); } catch { return; }
  render();
  loadStreak();
})();
// Coming back from Objetivos can restore this page from memory: show the saved numbers.
window.addEventListener('pageshow', async (e) => {
  if (!e.persisted) return;
  try { me = await ensureSession(); render(); } catch { /* redirected */ }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
