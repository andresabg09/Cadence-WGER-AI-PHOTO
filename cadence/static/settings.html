<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="cadence">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>cadence · Ajustes</title>
<meta name="theme-color" content="#0A0A0F">
<link rel="manifest" href="static/manifest.json">
<link rel="icon" href="static/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="static/css/pulse.css">
<script>
  (function () {
    var t = localStorage.getItem('cadence_theme') || 'dark';
    if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body class="with-shell" data-page="ajustes">
<div class="app">
  <div class="page-head" style="padding:22px 20px 14px;display:flex;align-items:center;gap:12px;">
    <a href="profile.html" id="backLink" aria-label="Volver" class="icon-btn" style="width:36px;height:36px;border-radius:11px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
    <h1 class="disp" style="margin:0;font-size:17px;font-weight:700;">Ajustes</h1>
  </div>

  <div class="app-content" id="content" style="display:flex;flex-direction:column;gap:16px;padding-bottom:60px;">
    <div>
      <div class="section-title">APP</div>
      <div class="menu-card">
        <button class="menu-row" id="installRow"><span class="ico" style="background:rgba(61,220,132,0.12);">📲</span><span class="label">Instalar app</span><span class="hint" id="installHint"></span><span class="chev">›</span></button>
        <button class="menu-row" id="themeRow"><span class="ico" style="background:rgba(255,138,91,0.12);">🎨</span><span class="label">Apariencia</span><span class="hint" id="themeHint"></span><span class="chev">›</span></button>
        <div class="menu-row" style="cursor: default;"><span class="ico" style="background:rgba(124,92,255,0.14);">🔊</span><span class="label">Sonidos</span><label class="switch"><input type="checkbox" id="soundOn" aria-label="Sonidos"><i></i></label></div>
        <div class="menu-row vol-row" id="volRow"><span class="ico" style="background:transparent;">🔉</span><input type="range" id="soundVol" min="0" max="100" step="5" aria-label="Volumen de los sonidos"><span class="hint" id="volHint"></span></div>
        <a class="menu-row" href="reminders.html"><span class="ico" style="background:rgba(45,212,255,0.12);">🔔</span><span class="label">Recordatorios</span><span class="chev">›</span></a>
      </div>
    </div>

    <div id="adminBox" style="display:none;">
      <div class="section-title">INVITACIONES (ADMINISTRACIÓN)</div>
      <div class="menu-card" style="padding:14px 15px;display:flex;flex-direction:column;gap:12px;">
        <p style="margin:0;font-size:12px;color:var(--ink-soft);line-height:1.5;">Cada persona necesita un código para crear su cuenta. Cada código se usa una sola vez.</p>
        <div style="display:flex;gap:8px;">
          <input class="input" id="inviteNote" maxlength="80" placeholder="Para quién es (opcional)" style="min-height:44px;font-size:13px;">
          <button class="btn-secondary" id="makeInvite" style="white-space:nowrap;min-height:44px;">Crear código</button>
        </div>
        <div id="newInvite" style="display:none;"></div>
        <div id="inviteList" style="display:flex;flex-direction:column;gap:8px;"></div>
        <div class="section-title" style="padding-top:6px;margin:0;">PERSONAS</div>
        <div id="userList" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </div>

    <div>
      <div class="section-title">CUENTA</div>
      <div class="menu-card">
        <button class="menu-row" id="passwordRow"><span class="ico" style="background:rgba(127,127,140,0.15);">🔑</span><span class="label">Cambiar contraseña</span><span class="chev">›</span></button>
        <button class="menu-row" data-soon="Ayuda y soporte"><span class="ico" style="background:rgba(127,127,140,0.15);">❓</span><span class="label">Ayuda y soporte</span><span class="hint">PRONTO</span><span class="chev">›</span></button>
        <button class="menu-row" data-soon="Términos y privacidad"><span class="ico" style="background:rgba(127,127,140,0.15);">📄</span><span class="label">Términos y privacidad</span><span class="hint">PRONTO</span><span class="chev">›</span></button>
      </div>
    </div>

    <button id="logout" style="display:flex;align-items:center;justify-content:center;padding:14px;border-radius:16px;border:1px solid rgba(255,92,92,0.35);background:transparent;color:var(--bad);font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:48px;">Cerrar sesión</button>
    <div style="text-align:center;font-size:10.5px;color:var(--ink-soft);opacity:0.7;">cadence</div>
  </div>
</div>

<script src="static/js/api.js"></script>
<script src="static/js/sfx.js"></script>
<script src="static/js/theme.js"></script>
<script>if (window.sfx) sfx.enter('enterSettings');</script>
<script src="static/js/shell.js"></script>
<script src="static/js/install.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let me = null;

// Back arrow: where you came from (the system Back button does the same).
$('backLink').addEventListener('click', (e) => {
  if (history.length > 1 && document.referrer.startsWith(window.location.origin)) { e.preventDefault(); history.back(); }
});

function openSheet(html, bind) {
  const scrim = document.createElement('div');
  scrim.className = 'sheet-scrim';
  const sheet = document.createElement('div');
  sheet.className = 'entry-sheet';
  sheet.setAttribute('role', 'dialog');
  sheet.innerHTML = html;
  document.body.append(scrim, sheet);
  pushOverlay(() => { scrim.remove(); sheet.remove(); });
  scrim.addEventListener('click', () => dismissOverlay());
  bind(sheet, (after) => dismissOverlay(after));
}

function renderSound() {
  $('soundOn').checked = sfx.isOn();
  $('soundVol').value = Math.round(sfx.volume() * 100);
  $('volHint').textContent = `${Math.round(sfx.volume() * 100)}%`;
  $('volRow').style.opacity = sfx.isOn() ? 1 : 0.4;
  $('soundVol').disabled = !sfx.isOn();
}
$('soundOn').addEventListener('change', () => { sfx.setOn($('soundOn').checked); renderSound(); sfx.play($('soundOn').checked ? 'save' : 'tick'); });
$('soundVol').addEventListener('input', () => { sfx.setVolume($('soundVol').value / 100); renderSound(); });
$('soundVol').addEventListener('change', () => sfx.play('save')); // hear the new level

function render() {
  renderSound();
  $('themeHint').textContent = LABELS[getStoredTheme()].toUpperCase();
  $('installHint').textContent = window.cadenceInstall && window.cadenceInstall.isInstalled() ? 'INSTALADA ✓' : '';
  $('adminBox').style.display = me.is_admin ? 'block' : 'none';
}

// ---- password ----
$('passwordRow').addEventListener('click', () => openSheet(`
  <h3 class="disp" style="margin:0 0 14px;font-size:17px;">Cambiar contraseña</h3>
  <label class="field"><span>CONTRASEÑA ACTUAL</span><input class="input" id="cur" type="password" autocomplete="current-password"></label>
  <label class="field"><span>NUEVA CONTRASEÑA</span><input class="input" id="neu" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></label>
  <div class="form-error" id="sErr"></div>
  <div class="sheet-actions"><button class="btn-primary" id="sSave">Cambiar</button></div>`, (sheet, close) => {
  sheet.querySelector('#sSave').addEventListener('click', async () => {
    try {
      await apiPost('api/auth/password', { current: sheet.querySelector('#cur').value, new: sheet.querySelector('#neu').value });
      close(() => showToast('Contraseña cambiada', 'ok'));
    } catch (err) { const e = sheet.querySelector('#sErr'); e.textContent = err.message; e.classList.add('show'); }
  });
}));

// ---- app: install and appearance ----
$('installRow').addEventListener('click', () => {
  if (window.cadenceInstall && window.cadenceInstall.isInstalled()) { showToast('cadence ya está instalada en este dispositivo', 'ok'); return; }
  if (window.cadenceInstall) window.cadenceInstall.open();
});
$('themeRow').addEventListener('click', () => {
  const cycle = themeCycle();
  const next = cycle[(cycle.indexOf(getStoredTheme()) + 1) % cycle.length];
  localStorage.setItem(STORAGE_KEY, next);
  applyTheme(next);
  themeSound(next);
  $('themeHint').textContent = LABELS[next].toUpperCase();
});
document.querySelectorAll('[data-soon]').forEach((el) => el.addEventListener('click', () => showToast(`${el.dataset.soon}: próximamente`, 'warn')));
$('logout').addEventListener('click', signOut);

// ---- administration: invitations and people ----
function inviteLink(code) {
  return `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, '')}login.html?invite=${encodeURIComponent(code)}`;
}

async function shareInvite(code, note) {
  const link = inviteLink(code);
  const text = `${note ? `${note}, t` : 'T'}e invito a cadence. Crea tu cuenta aquí (código ${code}): ${link}`;
  if (navigator.share) { try { await navigator.share({ text }); return; } catch { /* cancelled: copy instead */ } }
  try { await navigator.clipboard.writeText(text); showToast('Invitación copiada', 'ok'); }
  catch { showToast(`Código: ${code}`, 'warn'); }
}

async function loadAdmin() {
  if (!me.is_admin) return;
  let overview;
  try { overview = await apiGet('api/admin/overview'); } catch (err) { showToast(err.message); return; }
  $('inviteList').innerHTML = overview.invites.length ? overview.invites.map((i) => `
    <div style="display:flex;align-items:center;gap:10px;font-size:12px;">
      <span class="code-pill" style="${i.used_at ? 'opacity:.45;text-decoration:line-through;' : ''}">${escapeHtml(i.code)}</span>
      <span style="flex:1;color:var(--ink-soft);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${i.used_at ? `usada por ${escapeHtml(i.used_by || '')}` : escapeHtml(i.note || 'sin usar')}</span>
      ${i.used_at ? '' : `<button class="link-btn" data-share="${i.code}" data-note="${escapeHtml(i.note || '')}" style="padding:6px;">Compartir</button><button class="link-btn" data-del="${i.code}" style="padding:6px;color:var(--bad);">Borrar</button>`}
    </div>`).join('') : '<span style="font-size:12px;color:var(--ink-soft);">Aún no hay invitaciones.</span>';
  $('userList').innerHTML = overview.users.map((u) => `
    <div style="display:flex;align-items:center;gap:10px;font-size:12px;">
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><b>${escapeHtml(u.name)}</b> <span style="color:var(--ink-soft);">${escapeHtml(u.email)}${u.is_admin ? ' · admin' : ''}</span></span>
      ${u.id === me.id ? '' : `<button class="link-btn" data-reset="${u.id}" data-who="${escapeHtml(u.name)}" style="padding:6px;">Restablecer clave</button>`}
    </div>`).join('');
  $('inviteList').querySelectorAll('[data-share]').forEach((b) => b.addEventListener('click', () => shareInvite(b.dataset.share, b.dataset.note)));
  $('inviteList').querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', async () => {
    try { await apiDelete(`api/admin/invites/${b.dataset.del}`); loadAdmin(); } catch (err) { showToast(err.message); }
  }));
  $('userList').querySelectorAll('[data-reset]').forEach((b) => b.addEventListener('click', async () => {
    if (!confirm(`¿Generar un código para que ${b.dataset.who} elija una contraseña nueva?`)) return;
    try {
      const { code, email } = await apiPost(`api/admin/users/${b.dataset.reset}/reset-password`, {});
      const link = `${new URL('login.html', window.location.href).href}?reset=${encodeURIComponent(code)}&email=${encodeURIComponent(email)}`;
      const text = `Hola ${b.dataset.who}, restablecí tu acceso a cadence. Abre ${link} y elige tu nueva contraseña (código ${code}, sirve una vez y vence en 24 h).`;
      openSheet(`<h3 class="disp" style="margin:0 0 8px;font-size:17px;">Código para ${escapeHtml(b.dataset.who)}</h3>
        <p style="margin:0 0 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;">Envíaselo: en la pantalla de entrar toca «Tengo un código», pone su correo, este código y elige su nueva contraseña. Sirve una vez y vence en 24 horas. Su contraseña actual sigue funcionando hasta que lo use.</p>
        <div class="code-pill" style="font-size:20px;text-align:center;padding:14px;background:var(--bg);border-radius:14px;user-select:all;">${escapeHtml(code)}</div>
        <div class="sheet-actions"><button class="btn-secondary" id="sCopy">Compartir mensaje</button><button class="btn-primary" id="sOk">Listo</button></div>`, (sheet, close) => {
        sheet.querySelector('#sOk').addEventListener('click', () => close());
        sheet.querySelector('#sCopy').addEventListener('click', async () => {
          if (navigator.share) { try { await navigator.share({ text }); return; } catch { /* cancelled: copy instead */ } }
          try { await navigator.clipboard.writeText(text); showToast('Mensaje copiado', 'ok'); } catch { showToast(`Código: ${code}`, 'warn'); }
        });
      });
    } catch (err) { showToast(err.message); }
  }));
}

$('makeInvite').addEventListener('click', async () => {
  try {
    const note = $('inviteNote').value.trim();
    const { code } = await apiPost('api/admin/invites', { note });
    $('inviteNote').value = '';
    const box = $('newInvite');
    box.style.display = 'block';
    box.innerHTML = `<div style="background:var(--bg);border-radius:14px;padding:14px;text-align:center;">
      <div class="code-pill" style="font-size:22px;user-select:all;">${escapeHtml(code)}</div>
      <button class="btn-primary" id="shareNew" style="margin-top:12px;">Compartir invitación</button></div>`;
    $('shareNew').addEventListener('click', () => shareInvite(code, note));
    loadAdmin();
  } catch (err) { showToast(err.message); }
});

(async function init() {
  try { me = await ensureSession(); } catch { return; }
  render();
  loadAdmin();
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
