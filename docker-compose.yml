#
# Please consult the `Deployment` section in the docs if you want to deploy
# this. You *need* to keep this nginx service, even if you have your own,
# otherwise the static files will not be served correctly! If you do remove
# it, configure yours similarly to what's in config/nginx.conf
# Also take a look at the "Static files" section in the .env file

services:
  web:
    image: docker.io/wger/server:latest
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - ./config/prod.env
    volumes:
      - static:/home/wger/static
      - media:/home/wger/media
    expose:
      - 8000
    # Give gunicorn time to finish in-flight requests on shutdown
    stop_grace_period: 60s
    healthcheck:
      # Use a GET request (not --spider, which sends HEAD and makes gunicorn log
      # a warning on every check) against the lightweight version endpoint
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8000/api/v2/version/"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 5
    restart: unless-stopped

  nginx:
    image: docker.io/nginx:stable
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    depends_on:
      - web
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
      - static:/wger/static:ro
      - media:/wger/media:ro
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db:
    shm_size: 256mb
    environment:
      - TZ=Europe/Berlin
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: 5

  cache:
    volumes:
      - redis-data:/data

    # You probably want to limit the memory usage of the cache, otherwise it might
    # hog all the available memory. Remove or change according to your needs.
    #mem_limit: 5gb

  # celery (worker y beat) NO arranca por defecto: cada uno carga la app completa de wger en memoria (cientos de MB) y cadence no
  # lo usa (sin tareas programadas, USE_CELERY=False en prod.env). Para volver a encenderlo: COMPOSE_PROFILES=celery y USE_CELERY=True.
  celery_worker:
    profiles: ["celery"]
    image: docker.io/wger/server:latest
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    command: /start-worker
    env_file:
      - ./config/prod.env
    volumes:
      - media:/home/wger/media
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # `celery -A wger inspect ping` arrancaba toda la app de wger (Django + celery) cada 10 s: rafagas de CPU constantes.
      # Esto solo mira si el proceso de celery sigue vivo (la palabra va partida para que este mismo chequeo no cuente).
      test:
        - CMD
        - python3
        - -c
        - "import os,sys\nme=str(os.getpid())\nfor p in os.listdir('/proc'):\n    if p.isdigit() and p!=me:\n        try:\n            if (b'cel'+b'ery') in open('/proc/'+p+'/cmdline','rb').read(): sys.exit(0)\n        except OSError: pass\nsys.exit(1)"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  celery_beat:
    profiles: ["celery"]
    image: docker.io/wger/server:latest
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    command: /start-beat
    volumes:
      - celery-beat:/home/wger/beat/
    env_file:
      - ./config/prod.env
    depends_on:
      celery_worker:
        condition: service_healthy
    restart: unless-stopped

  # cadence: extension propia sobre wger, reconocimiento de comida por foto.
  # No modifica el core de wger, solo consume su API REST (WGER_BASE_URL).
  cadence:
    build: ./cadence
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    env_file:
      # required: false evita repetir el bug de powersync: si este archivo
      # no existe todavia, el stack completo (wger incluido) debe poder
      # seguir arrancando igual, en vez de fallar por completo.
      - path: ./cadence/.env
        required: false
    environment:
      # En EasyPanel el archivo cadence/.env no existe (esta en .gitignore);
      # las claves se ponen en la pestana "Entorno" del servicio, que Compose
      # interpola aqui. Nunca se escriben en el repo.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      WGER_API_TOKEN: ${WGER_API_TOKEN:-}
      WGER_BASE_URL: ${WGER_BASE_URL:-https://crm-cadence-wger-ai-photo.cjauws.easypanel.host}
      # Ruta directa a wger por la red de Docker (sin salir a internet). Si falla, cadence usa WGER_BASE_URL solo.
      WGER_INTERNAL_URL: ${WGER_INTERNAL_URL:-http://nginx}
      TIMEZONE: ${TIMEZONE:-America/Panama}
      USER_NAME: ${USER_NAME:-Andrés}
      DATA_DIR: /data
      # Cuentas: el primer registro es el administrador. Con ADMIN_EMAIL solo ese correo puede crearlo.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-false}
      ANALYZE_DAILY_LIMIT: ${ANALYZE_DAILY_LIMIT:-40}
    volumes:
      # Notas y fotos de cadence (lo que wger no guarda): sobreviven a cada Implementar.
      - cadence-data:/data
    depends_on:
      web:
        condition: service_healthy
    expose:
      - 8001
    healthcheck:
      # python -c avoids adding curl/wget to the image just for this.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

volumes:
  cadence-data:
  postgres-data:
  celery-beat:
  redis-data:

  # Heads up, if you remove these volumes and use folders directly you need to chown them
  # to the UID and GID 1000 even if it doesn't exist on your system. Also, they should
  # be readable by everyone.
  #
  # https://wger.readthedocs.io/en/latest/administration/errors.html#missing-static-files
  media:
  static:

networks:
  default:
    name: wger_network

# If you get an "additional properties 'extends' not allowed"-error, your compose version
# is too old (this needs at least 5.x). If you remove the "db" and "redis" services from
# this file, you should be able to start the stack.
include:
  - path: ./services/postgres.yaml
  - path: ./services/redis.yaml
